              private fun categoryOf(ai: ApplicationInfo?, pkg: String): String {
                  when (ai?.category) {
                      ApplicationInfo.CATEGORY_GAME -> return "Jogos"
                      ApplicationInfo.CATEGORY_AUDIO, ApplicationInfo.CATEGORY_VIDEO -> return "Entretenimento"
                      ApplicationInfo.CATEGORY_IMAGE -> return "Foto e Vídeo"
                      ApplicationInfo.CATEGORY_SOCIAL -> return "Social"
                      ApplicationInfo.CATEGORY_NEWS -> return "Notícias"
                      ApplicationInfo.CATEGORY_MAPS -> return "Viagens"
                      ApplicationInfo.CATEGORY_PRODUCTIVITY -> return "Produtividade"
                  }
                  val p = pkg.lowercase()
                  return when {
                      listOf("camera", "gallery", "photo", "galer").any { p.contains(it) } -> "Foto e Vídeo"
                      listOf("whatsapp", "telegram", "facebook", "instagram", "twitter", "messag", "mms",
                          "dialer", "contacts", "tiktok", "snapchat", "discord").any { p.contains(it) } -> "Social"
                      listOf("youtube", "netflix", "spotify", "music", "video", "player", "disney").any { p.contains(it) } -> "Entretenimento"
                      listOf("maps", "uber", "booking", "airbnb", "travel").any { p.contains(it) } -> "Viagens"
                      listOf("bank", "nubank", "wallet", "finance", "itau", "bradesco", "santander").any { p.contains(it) } -> "Finanças"
                      listOf("office", "docs", "drive", "mail", "calendar", "notes", "keep").any { p.contains(it) } -> "Produtividade"
                      else -> "Utilidades"
                  }
              }

              private fun refresh() {
                  val gen = ++refreshGen
                  bg.execute {
                      try {
                          val pm = packageManager
                          val main = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                          val list = pm.queryIntentActivities(main, 0)
                              .filter { it.activityInfo.packageName != packageName }
                          if (list.isEmpty() && loaded) return@execute
                          val sig = list.map { it.activityInfo.packageName }.distinct().sorted().joinToString("|")
                          if (loaded && sig == signature) return@execute
                          val m = LinkedHashMap<String, AppItem>()
                          for (ri in list) {
                              val pk = ri.activityInfo.packageName
                              if (m.containsKey(pk)) continue
                              val label = ri.loadLabel(pm).toString()
                              val icon = Icons.build(label, pk, ri.loadIcon(pm))
                              (icon as? IosIcon)?.prepare()
                              m[pk] = AppItem(
                                  label,
                                  pk,
                                  Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                                      .setClassName(pk, ri.activityInfo.name)
                                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED),
                                  icon,
                                  categoryOf(ri.activityInfo.applicationInfo, pk)
                              )
                          }
                          runOnUiThread { if (gen == refreshGen) applyApps(m, sig) }
                      } catch (_: Exception) {
                      }
                  }
              }

              private fun applyApps(m: LinkedHashMap<String, AppItem>, sig: String) {
                  signature = sig
                  apps = m
                  sorted = m.values.sortedBy { it.label.lowercase() }
                  syncLayout()
                  loaded = true
                  applyGrid()
                  rebuild()
              }

              private fun autoDock(): List<String> {
                  val pm = packageManager
                  val probes = listOf(
                      Intent(Intent.ACTION_DIAL),
                      Intent(Intent.ACTION_SENDTO, Uri.parse("smsto:")),
                      Intent(Intent.ACTION_VIEW, Uri.parse("https://example.com")),
                      Intent(MediaStore.ACTION_IMAGE_CAPTURE)
                  )
                  return probes
                      .mapNotNull { pm.resolveActivity(it, PackageManager.MATCH_DEFAULT_ONLY)?.activityInfo?.packageName }
                      .distinct()
              }

              private fun syncLayout() {
                  home = store.loadHome()
                  hidden = store.loadHidden().filter { apps.containsKey(it) }.toMutableSet()
                  val saved = store.loadDock()
                  dockPkgs = (saved ?: autoDock()).filter { apps.containsKey(it) }.distinct().take(Cfg.i("dockMax")).toMutableList()

                  val seen = HashSet<String>()
                  val cleaned = mutableListOf<Entry>()
                  for (e in home) {
                      when (e) {
                          is Entry.App -> {
                              if (apps.containsKey(e.pkg) && e.pkg !in dockPkgs && e.pkg !in hidden && seen.add(e.pkg)) {
                                  cleaned.add(e)
                              }
                          }
                          is Entry.Folder -> {
                              e.pkgs.retainAll { apps.containsKey(it) && it !in dockPkgs && it !in hidden && seen.add(it) }
                              if (e.pkgs.isNotEmpty()) cleaned.add(e)
                          }
                      }
                  }
                  for (a in sorted) {
                      if (a.pkg !in seen && a.pkg !in dockPkgs && a.pkg !in hidden) {
                          cleaned.add(Entry.App(a.pkg))
                          seen.add(a.pkg)
                      }
                  }
                  home = cleaned
                  normalize()
                  saveAll()
              }

              private fun normalize() {
                  val out = mutableListOf<Entry>()
                  for (e in home) {
                      when (e) {
                          is Entry.App -> out.add(e)
                          is Entry.Folder -> {
                              if (e.pkgs.size == 1) out.add(Entry.App(e.pkgs[0]))
                              else if (e.pkgs.size > 1) out.add(e)
                          }
                      }
                  }
                  home = out
              }

              private fun saveAll() {
                  store.saveHome(home)
                  store.saveDock(dockPkgs)
                  store.saveHidden(hidden)
              }

              private fun commit() {
                  normalize()
                  saveAll()
                  rebuild()
              }

              private fun applyGrid() {
                  if (pager.height > maxPagerH) maxPagerH = pager.height
                  val h = maxPagerH
                  val fixed = Cfg.i("rows")
                  val newRows = if (fixed > 0) fixed else if (h > 0) ((h - dp(16)) / cellH()).coerceIn(3, 6) else rows
                  if (newRows != rows || homePages.isEmpty()) {
                      rows = newRows
                      if (loaded) rebuild()
                  }
              }

              private fun rebuild() {
                  val per = COLS * rows
                  homePages = home.chunked(per).ifEmpty { listOf(emptyList<Entry>()) }
                  pager.adapter?.notifyDataSetChanged()
                  pager.offscreenPageLimit = Math.max(1, Math.min(homePages.size + 1, 5))
                  if (!positioned && loaded) {
                      pager.setCurrentItem(firstHome(), false)
                      positioned = true
                  }
                  buildDock()
                  updateDots(pager.currentItem)
                  updatePill()
              }

              // ================= Operações =================

              private fun removeFromHome(pkg: String) {
                  home = home.filterNot { it is Entry.App && it.pkg == pkg }.toMutableList()
                  for (e in home) if (e is Entry.Folder) e.pkgs.remove(pkg)
                  normalize()
              }

              private fun hideApp(pkg: String) {
                  removeFromHome(pkg)
                  dockPkgs.remove(pkg)
                  hidden.add(pkg)
                  commit()
              }

              private fun addToHome(pkg: String) {
                  hidden.remove(pkg)
                  removeFromHome(pkg)
                  home.add(Entry.App(pkg))
                  commit()
              }

              private fun dockApp(pkg: String) {
                  removeFromHome(pkg)
                  hidden.remove(pkg)
                  if (dockPkgs.size < Cfg.i("dockMax") && pkg !in dockPkgs) dockPkgs.add(pkg)
                  commit()
              }

              private fun undock(pkg: String) {
                  dockPkgs.remove(pkg)
                  home.add(Entry.App(pkg))
                  commit()
              }

              private fun takeOutOfFolder(pkg: String, f: Entry.Folder) {
                  closeGroup()
                  f.pkgs.remove(pkg)
                  home.add(Entry.App(pkg))
                  commit()
              }

              private fun uninstall(pkg: String) {
                  try {
                      startActivity(Intent(Intent.ACTION_DELETE, Uri.parse("package:$pkg")))
                  } catch (_: Exception) {
                      Toast.makeText(this, "Não foi possível apagar", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun appInfo(pkg: String) {
                  try {
                      startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:$pkg")))
                  } catch (_: Exception) {
                  }
              }

              private fun startApp(a: AppItem, opts: Bundle?) {
                  try {
                      startActivity(a.intent, opts)
                  } catch (_: Exception) {
                      Toast.makeText(this, "Não foi possível abrir", Toast.LENGTH_SHORT).show()
                      dismissLaunch(false)
                      return
                  }
                  if (searchOverlay != null) closeSearch()
                  if (groupOverlay != null) closeGroup()
                  if (drawerOverlay != null) closeDrawer()
              }

              private fun launch(a: AppItem, v: View?) {
                  val opts = ActivityOptions.makeCustomAnimation(
                      this, android.R.anim.fade_in, android.R.anim.fade_out
                  ).toBundle()
                  if (v == null || v.width == 0 || launchOverlay != null || !Cfg.b("animLaunch")) {
                      startApp(a, opts)
                      return
                  }
                  val cl = IntArray(2)
                  content.getLocationOnScreen(cl)
                  val vl = IntArray(2)
                  v.getLocationOnScreen(vl)
                  val iv = ImageView(this)
                  iv.setImageDrawable(a.icon)
                  iv.scaleType = ImageView.ScaleType.FIT_XY
                  val lp = FrameLayout.LayoutParams(v.width, v.height)
                  lp.leftMargin = vl[0] - cl[0] - content.paddingLeft
                  lp.topMargin = vl[1] - cl[1] - content.paddingTop
                  content.addView(iv, lp)
                  launchOverlay = iv
                  val big = resources.displayMetrics.widthPixels * 1.15f / v.width
                  iv.animate().scaleX(big).scaleY(big).setDuration(380)
                      .setInterpolator(springOut)
                      .start()
                  val homeScale = if (Cfg.s("animStyle") == "ios") 1.18f else 1.04f
                  column.animate().scaleX(homeScale).scaleY(homeScale).alpha(0f).setDuration(320)
                      .setInterpolator(springOut).start()
                  iv.postDelayed({ startApp(a, opts) }, 120)
                  iv.postDelayed({ if (launchOverlay === iv) dismissLaunch(true) }, 3000)
              }

              private fun dismissLaunch(animate: Boolean) {
                  val iv = launchOverlay ?: return
                  launchOverlay = null
                  if (animate) {
                      column.animate().scaleX(1f).scaleY(1f).alpha(1f).setDuration(340)
                          .setInterpolator(springOut).start()
                      iv.animate().scaleX(1f).scaleY(1f).alpha(0f).setDuration(320)
                          .setInterpolator(springOut)
                          .withEndAction { content.removeView(iv) }
                          .start()
                  } else {
                      column.animate().cancel()
                      column.scaleX = 1f
                      column.scaleY = 1f
                      column.alpha = 1f
                      content.removeView(iv)
                  }
              }

              private fun setEditing(on: Boolean) {
                  editing = on
                  doneBtn.visibility = if (on) View.VISIBLE else View.GONE
                  if (!on) {
                      normalize()
                      saveAll()
                  }
                  styleChrome()
                  rebuild()
              }

              private fun showMenu(title: String, build: OptionList.() -> Unit) {
                  val o = OptionList()
                  o.build()
                  val dlg = AlertDialog.Builder(this, android.R.style.Theme_Material_Light_Dialog_Alert)
                      .setTitle(title)
                      .setItems(o.titles.toTypedArray()) { _, i -> o.actions[i]() }
                      .create()
                  dlg.show()
                  dlg.window?.setBackgroundDrawable(rounded(0xF5FFFFFF.toInt(), dp(22)))
              }

              private fun appMenu(pkg: String, where: Where, folder: Entry.Folder? = null) {
                  val a = apps[pkg] ?: return
                  val onHome = home.any { (it is Entry.App && it.pkg == pkg) || (it is Entry.Folder && pkg in it.pkgs) }
                  showMenu(a.label) {
                      if (onHome || where == Where.DOCK) add("Editar Tela de Início") {
                          closeGroup()
                          setEditing(true)
                      }
                      if (where == Where.DOCK) add("Tirar do Dock") { undock(pkg) }
                      else if (pkg !in dockPkgs && dockPkgs.size < Cfg.i("dockMax")) add("Colocar no Dock") { dockApp(pkg) }
                      if (where == Where.FOLDER && folder != null) add("Tirar da pasta") { takeOutOfFolder(pkg, folder) }
                      if (onHome) add("Remover da Tela de Início") { hideApp(pkg) }
                      else if (pkg !in dockPkgs) add("Adicionar à Tela de Início") { addToHome(pkg) }
                      add("Informações do app") { appInfo(pkg) }
                      add("Apagar app") { uninstall(pkg) }
                      add("Ajustes do iLauncher") { openSettings() }
                  }
              }

              private fun folderMenu(f: Entry.Folder) {
                  showMenu(f.name) {
                      add("Editar Tela de Início") { setEditing(true) }
                      add("Renomear") { openGroup(f.name, f.pkgs.toList(), f) }
                  }
              }

              // ================= Ícones =================

              private fun roundIcon(d: Drawable, size: Int): ImageView {
                  return ImageView(this).apply {
                      setImageDrawable(d)
                      scaleType = ImageView.ScaleType.FIT_XY
                  }
              }

              private fun pressable(v: View) {
                  v.setOnTouchListener { view, ev ->
                      if (!Cfg.b("animPress")) return@setOnTouchListener false
                      when (ev.actionMasked) {
                          MotionEvent.ACTION_DOWN ->
                              if (Cfg.s("animStyle") == "ios") {
                                  view.animate().alpha(0.72f).scaleX(0.97f).scaleY(0.97f).setDuration(80)
                                      .setInterpolator(DecelerateInterpolator()).start()
                              } else {
                                  view.animate().scaleX(0.9f).scaleY(0.9f).setDuration(90)
                                      .setInterpolator(DecelerateInterpolator()).start()
                              }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL ->
                              view.animate().alpha(1f).scaleX(1f).scaleY(1f).setDuration(280)
                                  .setInterpolator(if (Cfg.s("animStyle") == "ios") springOut else OvershootInterpolator(2.5f))
                                  .start()
                      }
                      false
                  }
              }

              private fun folderIconView(f: Entry.Folder): View {
                  val n = if (Cfg.s("folderStyle") == "grid2") 2 else 3
                  val box = FrameLayout(this)
                  box.background = rounded(glass(40), (iconPx * 0.225f).toInt())
                  val pad = (iconPx * (if (n == 2) 0.14f else 0.1f)).toInt()
                  val mini = (iconPx * (if (n == 2) 0.32f else 0.22f)).toInt()
                  val grid = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad, pad, pad)
                  }
                  val items = f.pkgs.take(n * n)
                  for (r in 0 until n) {
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      for (c in 0 until n) {
                          val a = items.getOrNull(r * n + c)?.let { apps[it] }
                          val v: View = if (a != null) roundIcon(a.icon, mini) else View(this)
                          row.addView(v, LinearLayout.LayoutParams(mini, mini).apply { setMargins(1, 1, 1, 1) })
                      }
                      grid.addView(row)
                  }
                  box.addView(grid, FrameLayout.LayoutParams(MATCH, MATCH))
                  return box
              }

              private fun wiggle(v: View) {
                  val a = ObjectAnimator.ofFloat(v, View.ROTATION, -2.2f, 2.2f).apply {
                      duration = 100L + (Math.random() * 40).toLong()
                      repeatCount = ValueAnimator.INFINITE
                      repeatMode = ValueAnimator.REVERSE
                      startDelay = (Math.random() * 100).toLong()
                  }
                  v.addOnAttachStateChangeListener(object : View.OnAttachStateChangeListener {
                      override fun onViewAttachedToWindow(view: View) {
                          if (!a.isStarted) a.start()
                      }

                      override fun onViewDetachedFromWindow(view: View) {
                          a.cancel()
                      }
                  })
                  v.setLayerType(View.LAYER_TYPE_HARDWARE, null)
                  if (v.isAttachedToWindow) a.start()
              }

              private fun labelView(text: String, color: Int = Color.WHITE): TextView {
                  return TextView(this).apply {
                      this.text = text
                      textSize = Cfg.i("labelSize").toFloat()
                      typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                      setTextColor(color)
                      if (color == Color.WHITE) setShadowLayer(4f, 0f, 1f, 0x99000000.toInt())
                      maxLines = 1
                      ellipsize = TextUtils.TruncateAt.END
                      gravity = Gravity.CENTER
                      setPadding(dp(2), dp(5), dp(2), 0)
                  }
              }

              private fun entryCell(e: Entry): View {
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(0, dp(8), 0, 0)
                  }
                  val holder = FrameLayout(this)
                  val name: String
                  when (e) {
                      is Entry.App -> {
                          val a = apps[e.pkg] ?: return View(this)
                          holder.addView(roundIcon(a.icon, iconPx), FrameLayout.LayoutParams(iconPx, iconPx))
                          name = a.label
                          if (editing) {
                              val badge = TextView(this).apply {
                                  text = "−"
                                  textSize = 15f
                                  typeface = Typeface.DEFAULT_BOLD
                                  setTextColor(Color.WHITE)
                                  gravity = Gravity.CENTER
                                  background = GradientDrawable().apply {
                                      shape = GradientDrawable.OVAL
                                      setColor(0xFF8E8E93.toInt())
                                  }
                                  setOnClickListener {
                                      showMenu(a.label) {
                                          add("Remover da Tela de Início") { hideApp(a.pkg) }
                                          add("Apagar app") { uninstall(a.pkg) }
                                      }
                                  }
                              }
                              holder.addView(badge, FrameLayout.LayoutParams(dp(22), dp(22), Gravity.TOP or Gravity.START))
                          }
                      }
                      is Entry.Folder -> {
                          holder.addView(folderIconView(e), FrameLayout.LayoutParams(iconPx, iconPx))
                          name = e.name
                      }
                  }
                  col.addView(holder, LinearLayout.LayoutParams(iconPx, iconPx))
                  if (Cfg.b("labels")) col.addView(labelView(name), LinearLayout.LayoutParams(MATCH, WRAP))

                  col.setOnClickListener { v ->
                      if (!editing) {
                          when (e) {
                              is Entry.App -> apps[e.pkg]?.let { launch(it, holder) }
                              is Entry.Folder -> openGroup(e.name, e.pkgs.toList(), e, holder)
                          }
                      }
                  }
                  col.setOnLongClickListener { v ->
                      haptic(v)
                      if (editing) {
                          startDrag(v, e)
                      } else {
                          when (e) {
                              is Entry.App -> appMenu(e.pkg, Where.HOME)
                              is Entry.Folder -> folderMenu(e)
                          }
                      }
                      true
                  }
                  pressable(col)
                  if (editing && Cfg.b("wiggle")) wiggle(col)
                  return col
              }

              // ================= Arrastar e soltar =================

              private fun startDrag(v: View, e: Entry) {
                  dragEntry = e
                  dragSource = v
                  v.alpha = 0.3f
                  v.startDragAndDrop(ClipData.newPlainText("e", "e"), View.DragShadowBuilder(v), null, 0)
              }

              private fun maybeFlip(v: View, ev: DragEvent) {
                  val now = System.currentTimeMillis()
                  if (now - lastFlip < 800) return
                  val loc = IntArray(2)
                  v.getLocationOnScreen(loc)
                  val x = loc[0] + ev.x
                  val w = resources.displayMetrics.widthPixels
                  val cur = pager.currentItem
                  if (x < dp(28) && cur > firstHome()) {
                      pager.setCurrentItem(cur - 1, true)
                      lastFlip = now
                  } else if (x > w - dp(28) && cur < firstHome() + homePages.size - 1) {
                      pager.setCurrentItem(cur + 1, true)
                      lastFlip = now
                  }
              }

              private fun slotListener(target: Entry?, hp: Int): View.OnDragListener {
                  return View.OnDragListener { v, ev ->
                      when (ev.action) {
                          DragEvent.ACTION_DRAG_STARTED -> dragEntry != null
                          DragEvent.ACTION_DRAG_LOCATION -> {
                              maybeFlip(v, ev)
                              true
                          }
                          DragEvent.ACTION_DROP -> {
                              val w = if (v.width > 0) v.width else 1
                              val zone = if (!Cfg.b("folders")) {
                                  if (ev.x < w * 0.5f) -1 else 1
                              } else when {
                                  ev.x < w * 0.25f -> -1
                                  ev.x > w * 0.75f -> 1
                                  else -> 0
                              }
                              val d = dragEntry
                              v.post { handleDrop(d, target, zone, hp) }
                              true
                          }
                          DragEvent.ACTION_DRAG_ENDED -> {
                              dragSource?.alpha = 1f
                              dragSource = null
                              dragEntry = null
                              true
                          }
                          else -> true
                      }
                  }
              }

              private fun handleDrop(d: Entry?, target: Entry?, zone: Int, hp: Int) {
                  if (d == null || d === target) {
                      rebuild()
                      return
                  }
                  val per = COLS * rows
                  val dIdx = home.indexOfFirst { it === d }
                  if (dIdx < 0) {
                      rebuild()
                      return
                  }
                  if (target == null) {
                      var tIdx = Math.min(home.size, (hp + 1) * per)
                      home.removeAt(dIdx)
                      if (dIdx < tIdx) tIdx--
                      home.add(tIdx.coerceIn(0, home.size), d)
                  } else {
                      val tIdx = home.indexOfFirst { it === target }
                      if (tIdx < 0) {
                          rebuild()
                          return
                      }
                      if (zone == 0 && d is Entry.App && target is Entry.App) {
                          home[tIdx] = Entry.Folder("Pasta", mutableListOf(target.pkg, d.pkg))
                          home.removeAt(dIdx)
                      } else if (zone == 0 && d is Entry.App && target is Entry.Folder) {
                          target.pkgs.add(d.pkg)
                          home.removeAt(dIdx)
                      } else {
                          home.removeAt(dIdx)
                          val n = home.indexOfFirst { it === target }
                          home.add(if (zone < 0) n else n + 1, d)
                      }
                  }
                  commit()
              }

              // ================= Páginas =================

              private fun buildHomePage(hp: Int): View {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(8), dp(8), dp(8), 0)
                  }
                  val items = homePages.getOrNull(hp) ?: emptyList()
                  if (!editing) {
                      root.setOnLongClickListener {
                          haptic(it)
                          openHomeMenu()
                          true
                      }
                  }
                  for (r in 0 until rows) {
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      root.addView(row, LinearLayout.LayoutParams(MATCH, 0, 1f))
                      for (c in 0 until COLS) {
                          val slot = FrameLayout(this)
                          val e = items.getOrNull(r * COLS + c)
                          if (e != null) {
                              slot.addView(
                                  entryCell(e),
                                  FrameLayout.LayoutParams(
                                      resources.displayMetrics.widthPixels / COLS - dp(6),
                                      WRAP,
                                      Gravity.TOP or Gravity.CENTER_HORIZONTAL
                                  )
                              )
                          }
                          if (editing) slot.setOnDragListener(slotListener(e, hp))
                          if (e == null && !editing) {
                              slot.setOnLongClickListener {
                                  haptic(it)
                                  openHomeMenu()
                                  true
                              }
                          }
                          row.addView(slot, LinearLayout.LayoutParams(0, MATCH, 1f))
                      }
                  }
                  return root
              }

              private fun buildDock() {
                  dock.removeAllViews()
                  for (pk in dockPkgs) {
                      val a = apps[pk] ?: continue
                      val frame = FrameLayout(this)
                      val iv = roundIcon(a.icon, iconPx)
                      pressable(iv)
                      iv.setOnClickListener { launch(a, iv) }
                      iv.setOnLongClickListener {
                          haptic(it)
                          appMenu(a.pkg, Where.DOCK)
                          true
                      }
                      frame.addView(iv, FrameLayout.LayoutParams(iconPx, iconPx, Gravity.CENTER))
                      dock.addView(frame, LinearLayout.LayoutParams(0, WRAP, 1f))
                  }
                  dock.visibility = if (dockPkgs.isEmpty() || !Cfg.b("dock")) View.GONE else View.VISIBLE
              }

              private fun updateDots(selected: Int) {
                  val total = pageCount()
                  if (dots.childCount != total) {
                      dots.removeAllViews()
                      for (i in 0 until total) {
                          val d = View(this)
                          d.background = GradientDrawable().apply {
                              shape = GradientDrawable.OVAL
                              setColor(0x66FFFFFF)
                          }
                          dots.addView(d, LinearLayout.LayoutParams(dp(7), dp(7)).apply {
                              setMargins(dp(4), 0, dp(4), 0)
                          })
                      }
                  }
                  for (i in 0 until total) {
                      val bg = dots.getChildAt(i).background as GradientDrawable
                      bg.setColor(if (i == selected) Color.WHITE else 0x66FFFFFF)
                  }
              }

              private fun updatePill() {
                  val p = pager.currentItem
                  pill.visibility = if (!Cfg.b("pill")) View.GONE
                  else if (!editing && isHomePage(p)) View.VISIBLE else View.INVISIBLE
              }

              // ---------- Hoje (widgets) ----------

              private fun bar(pct: Int, color: Int): View {
                  val track = LinearLayout(this)
                  track.weightSum = 100f
                  track.background = rounded(0x33FFFFFF, dp(4))
                  val fill = View(this)
                  fill.background = rounded(color, dp(4))
                  track.addView(fill, LinearLayout.LayoutParams(0, MATCH, pct.coerceIn(1, 100).toFloat()))
                  return track
              }

              private fun tv(text: String, size: Float, color: Int, bold: Boolean = false): TextView {
                  return TextView(this).apply {
                      this.text = text
                      textSize = size
                      setTextColor(color)
                      if (bold) typeface = Typeface.DEFAULT_BOLD
                  }
              }

              private fun buildToday(): View {
                  val w = resources.displayMetrics.widthPixels
                  val gap = dp(12)
                  val side = (w - dp(32) - gap) / 2

                  val sv = ScrollView(this)
                  sv.isVerticalScrollBarEnabled = false
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(8), dp(16), dp(16))
                  }
                  sv.addView(col, FrameLayout.LayoutParams(MATCH, WRAP))

                  if (Cfg.b("wClock")) col.addView(TextClock(this).apply {
                      format24Hour = "HH:mm"
                      format12Hour = "h:mm"
                      textSize = 56f
                      typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                      setTextColor(Color.WHITE)
                      setShadowLayer(6f, 0f, 1f, 0x66000000)
                  }, LinearLayout.LayoutParams(MATCH, WRAP))
                  if (Cfg.b("wClock")) col.addView(TextClock(this).apply {
                      format24Hour = "EEEE, d 'de' MMMM"
                      format12Hour = "EEEE, d 'de' MMMM"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      setShadowLayer(6f, 0f, 1f, 0x66000000)
                  }, LinearLayout.LayoutParams(MATCH, WRAP))

                  val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }

                  // Calendário
                  val now = Date()
                  val cal = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = rounded(Color.WHITE, dp(22))
                      setPadding(dp(16), dp(14), dp(16), dp(14))
                  }
                  cal.addView(tv(
                      java.text.SimpleDateFormat("EEEE", Locale.getDefault()).format(now).uppercase(),
                      13f, 0xFFFF3B30.toInt(), true
                  ))
                  cal.addView(tv(
                      java.text.SimpleDateFormat("d", Locale.getDefault()).format(now),
                      58f, 0xFF111111.toInt()
                  ).apply { typeface = Typeface.create("sans-serif-light", Typeface.NORMAL) })
                  cal.addView(tv(
                      java.text.SimpleDateFormat("MMMM yyyy", Locale.getDefault()).format(now),
                      13f, 0xFF6B6B6B.toInt()
                  ))
                  if (Cfg.b("wCal")) row.addView(cal, LinearLayout.LayoutParams(side, side))

                  // Bateria
                  val bi = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val level = bi?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                  val scale = bi?.getIntExtra(BatteryManager.EXTRA_SCALE, 100) ?: 100
                  val pct = if (level >= 0 && scale > 0) level * 100 / scale else 0
                  val st = bi?.getIntExtra(BatteryManager.EXTRA_STATUS, -1) ?: -1
                  val charging = st == BatteryManager.BATTERY_STATUS_CHARGING || st == BatteryManager.BATTERY_STATUS_FULL
                  val bat = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = rounded(0x99000000.toInt(), dp(22))
                      setPadding(dp(16), dp(14), dp(16), dp(14))
                  }
                  bat.addView(tv("Bateria", 13f, 0xFFBBBBBB.toInt(), true))
                  bat.addView(tv("$pct%", 40f, Color.WHITE).apply {
                      typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                  })
                  bat.addView(tv(if (charging) "Carregando" else "Em uso", 13f, 0xFFBBBBBB.toInt()))
                  bat.addView(
                      bar(pct, if (pct < 20 && !charging) 0xFFFF3B30.toInt() else 0xFF34C759.toInt()),
                      LinearLayout.LayoutParams(MATCH, dp(8)).apply { topMargin = dp(12) }
                  )
                  if (Cfg.b("wBat")) row.addView(bat, LinearLayout.LayoutParams(side, side).apply {
                      leftMargin = if (row.childCount > 0) gap else 0
                  })
                  if (row.childCount > 0) col.addView(row, LinearLayout.LayoutParams(MATCH, WRAP).apply { topMargin = dp(16) })

                  // Atalhos para as configurações
                  if (Cfg.b("wLinks")) {
                      val links = listOf(
                          Triple("📶", "Wi-Fi", Settings.ACTION_WIFI_SETTINGS),
                          Triple("🔵", "Bluetooth", Settings.ACTION_BLUETOOTH_SETTINGS),
                          Triple("🔊", "Som", Settings.ACTION_SOUND_SETTINGS),
                          Triple("☀️", "Tela", Settings.ACTION_DISPLAY_SETTINGS),
                          Triple("🔋", "Bateria", Intent.ACTION_POWER_USAGE_SUMMARY),
                          Triple("💾", "Armazenamento", Settings.ACTION_INTERNAL_STORAGE_SETTINGS),
                          Triple("📱", "Apps", Settings.ACTION_APPLICATION_SETTINGS),
                          Triple("✈️", "Modo avião", Settings.ACTION_AIRPLANE_MODE_SETTINGS),
                          Triple("⚙️", "iLauncher", "")
                      )
                      val lk = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          background = rounded(0x99000000.toInt(), dp(22))
                          setPadding(dp(12), dp(14), dp(12), dp(8))
                      }
                      lk.addView(tv("Atalhos", 13f, 0xFFBBBBBB.toInt(), true).apply { setPadding(dp(4), 0, 0, dp(8)) })
                      for (chunk in links.chunked(3)) {
                          val r = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                          for (i in 0 until 3) {
                              val item = chunk.getOrNull(i)
                              if (item == null) {
                                  r.addView(View(this), LinearLayout.LayoutParams(0, dp(64), 1f))
                                  continue
                              }
                              val chip = LinearLayout(this).apply {
                                  orientation = LinearLayout.VERTICAL
                                  gravity = Gravity.CENTER
                                  background = rounded(0x33FFFFFF, dp(14))
                                  setPadding(dp(4), dp(6), dp(4), dp(6))
                              }
                              chip.addView(tv(item.first, 22f, Color.WHITE))
                              chip.addView(tv(item.second, 11f, Color.WHITE).apply {
                                  maxLines = 1
                                  ellipsize = TextUtils.TruncateAt.END
                              })
                              chip.setOnClickListener {
                                  if (item.third.isEmpty()) {
                                      openSettings()
                                  } else {
                                      try {
                                          startActivity(Intent(item.third))
                                      } catch (_: Exception) {
                                          Toast.makeText(this, "Não foi possível abrir", Toast.LENGTH_SHORT).show()
                                      }
                                  }
                              }
                              pressable(chip)
                              r.addView(chip, LinearLayout.LayoutParams(0, dp(64), 1f).apply {
                                  setMargins(dp(3), dp(3), dp(3), dp(3))
                              })
                          }
                          lk.addView(r, LinearLayout.LayoutParams(MATCH, WRAP))
                      }
                      col.addView(lk, LinearLayout.LayoutParams(MATCH, WRAP).apply { topMargin = gap })
                  }

                  // Medidor de temperatura (bateria)
                  if (Cfg.b("wTemp")) {
                      val temp = (bi?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0) ?: 0) / 10f
                      val tc = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          gravity = Gravity.CENTER_HORIZONTAL
                          background = rounded(0x99000000.toInt(), dp(22))
                          setPadding(dp(16), dp(14), dp(16), dp(10))
                      }
                      tc.addView(tv("Temperatura", 13f, 0xFFBBBBBB.toInt(), true))
                      val g = GaugeView(this)
                      g.value = temp
                      g.title = "Bateria"
                      tc.addView(g, LinearLayout.LayoutParams(dp(150), dp(140)))
                      col.addView(tc, LinearLayout.LayoutParams(MATCH, WRAP).apply { topMargin = gap })
                  }

                  // Armazenamento
                  var used = 0.0
                  var total = 1.0
                  try {
                      val sf = StatFs(Environment.getDataDirectory().path)
                      total = sf.blockCountLong.toDouble() * sf.blockSizeLong / 1073741824.0
                      val free = sf.availableBlocksLong.toDouble() * sf.blockSizeLong / 1073741824.0
                      used = total - free
                  } catch (_: Exception) {
                  }
                  val sto = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = rounded(0x99000000.toInt(), dp(22))
                      setPadding(dp(16), dp(14), dp(16), dp(14))
                  }
                  sto.addView(tv("Armazenamento", 13f, 0xFFBBBBBB.toInt(), true))
                  sto.addView(tv("%.1f GB de %.0f GB".format(used, total), 22f, Color.WHITE))
                  sto.addView(
                      bar((used / total * 100).toInt(), 0xFF0A84FF.toInt()),
                      LinearLayout.LayoutParams(MATCH, dp(8)).apply { topMargin = dp(12) }
                  )
                  if (Cfg.b("wSto")) col.addView(sto, LinearLayout.LayoutParams(MATCH, WRAP).apply { topMargin = gap })
                  return sv
              }

              // ---------- Biblioteca de Apps ----------

              private fun searchField(hintText: String): EditText {
                  return EditText(this).apply {
                      hint = hintText
                      setHintTextColor(0xAAFFFFFF.toInt())
                      setTextColor(Color.WHITE)
                      inputType = InputType.TYPE_CLASS_TEXT
                      isSingleLine = true
                      imeOptions = EditorInfo.IME_ACTION_SEARCH
                      setPadding(dp(16), dp(10), dp(16), dp(10))
                      background = rounded(0x44FFFFFF, dp(14))
                  }
              }

              private fun appRow(a: AppItem, where: Where): View {
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(6), 0, dp(6))
                  }
                  val size = dp(48)
                  row.addView(roundIcon(a.icon, size), LinearLayout.LayoutParams(size, size))
                  row.addView(TextView(this).apply {
                      text = a.label
                      textSize = 17f
                      setTextColor(Color.WHITE)
                      setPadding(dp(14), 0, 0, 0)
                  }, LinearLayout.LayoutParams(0, WRAP, 1f))
                  row.setOnClickListener { launch(a, row) }
                  row.setOnLongClickListener {
                      appMenu(a.pkg, where)
                      true
                  }
                  return row
              }

              private fun categoryTile(title: String, list: List<AppItem>, tileW: Int): View {
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val padding = dp(12)
                  val inner = tileW - padding * 2
                  val gapPx = dp(10)
                  val mini = (inner - gapPx) / 2

                  fun slot(i: Int): View {
                      if (i == 3 && list.size > 4) {
                          val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                          val tiny = (mini - dp(4)) / 2
                          val rest = list.drop(3).take(4)
                          for (r in 0 until 2) {
                              val rr = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                              for (c in 0 until 2) {
                                  val a = rest.getOrNull(r * 2 + c)
                                  val v: View = if (a != null) roundIcon(a.icon, tiny) else View(this)
                                  rr.addView(v, LinearLayout.LayoutParams(tiny, tiny).apply { setMargins(1, 1, 1, 1) })
                              }
                              box.addView(rr)
                          }
                          box.setOnClickListener { openGroup(title, list.map { it.pkg }, null) }
                          return box
                      }
                      val a = list.getOrNull(i) ?: return View(this)
                      val iv = roundIcon(a.icon, mini)
                      pressable(iv)
                      iv.setOnClickListener { launch(a, iv) }
                      iv.setOnLongClickListener {
                          appMenu(a.pkg, Where.LIBRARY)
                          true
                      }
                      return iv
                  }

                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = rounded(glass(27), dp(24))
                      setPadding(padding, padding, padding, padding)
                  }
                  for (r in 0 until 2) {
                      val rr = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      for (c in 0 until 2) {
                          rr.addView(slot(r * 2 + c), LinearLayout.LayoutParams(mini, mini).apply {
                              if (c == 0) rightMargin = gapPx
                              if (r == 0) bottomMargin = gapPx
                          })
                      }
                      card.addView(rr)
                  }
                  col.addView(card, LinearLayout.LayoutParams(tileW, WRAP))
                  col.addView(TextView(this).apply {
                      text = title
                      textSize = 12f
                      setTextColor(Color.WHITE)
                      setPadding(dp(6), dp(5), 0, dp(14))
                  })
                  return col
              }

              private fun buildLibrary(): View {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(if (Cfg.s("tint") == "dark") 0x99000000.toInt() else 0x55000000)
                      setPadding(dp(16), dp(12), dp(16), 0)
                  }
                  ViewCompat.setOnApplyWindowInsetsListener(root) { v, insets ->
                      val sys = insets.getInsets(WindowInsetsCompat.Type.systemBars())
                      val ime = insets.getInsets(WindowInsetsCompat.Type.ime())
                      val below = (pager.parent as View).height - pager.height
                      v.setPadding(dp(16), dp(12), dp(16), Math.max(0, ime.bottom - sys.bottom - below))
                      insets
                  }
                  val search = searchField("Biblioteca de Apps")
                  root.addView(search, LinearLayout.LayoutParams(MATCH, WRAP))

                  val tileW = (resources.displayMetrics.widthPixels - dp(32) - dp(14)) / 2
                  val scroll = ScrollView(this)
                  scroll.isVerticalScrollBarEnabled = false
                  val grid = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, dp(14), 0, dp(12))
                  }
                  scroll.addView(grid, FrameLayout.LayoutParams(MATCH, WRAP))

                  val groups = sorted.groupBy { it.category }
                  val tiles = CATEGORIES.filter { groups.containsKey(it) }
                  for (i in tiles.indices step 2) {
                      val r = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      r.addView(categoryTile(tiles[i], groups[tiles[i]]!!, tileW))
                      if (i + 1 < tiles.size) {
                          r.addView(
                              categoryTile(tiles[i + 1], groups[tiles[i + 1]]!!, tileW),
                              LinearLayout.LayoutParams(tileW, WRAP).apply { leftMargin = dp(14) }
                          )
                      }
                      grid.addView(r)
                  }

                  val shown = mutableListOf<AppItem>()
                  val list = ListView(this)
                  list.divider = null
                  list.setSelector(android.R.color.transparent)
                  list.visibility = View.GONE
                  val adapter = object : BaseAdapter() {
                      override fun getCount() = shown.size
                      override fun getItem(p: Int): Any = shown[p]
                      override fun getItemId(p: Int) = p.toLong()
                      override fun getView(p: Int, convert: View?, parent: ViewGroup): View =
                          appRow(shown[p], Where.LIBRARY)
                  }
                  list.adapter = adapter

                  search.doAfterTextChanged { s ->
                      val q = s?.toString().orEmpty().trim()
                      if (q.isEmpty()) {
                          scroll.visibility = View.VISIBLE
                          list.visibility = View.GONE
                      } else {
                          shown.clear()
                          shown.addAll(sorted.filter { it.label.contains(q, ignoreCase = true) })
                          adapter.notifyDataSetChanged()
                          scroll.visibility = View.GONE
                          list.visibility = View.VISIBLE
                      }
                  }
                  root.addView(scroll, LinearLayout.LayoutParams(MATCH, 0, 1f))
                  root.addView(list, LinearLayout.LayoutParams(MATCH, 0, 1f))
                  return root
              }

              // ================= Overlays =================

              private fun hideKeyboard(v: View) {
                  val imm = getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager
                  imm.hideSoftInputFromWindow(v.windowToken, 0)
              }

              private fun openGroup(title: String, pkgs: List<String>, folder: Entry.Folder?, from: View? = null) {
                  if (searchOverlay != null) closeSearch()
                  if (groupOverlay != null) closeGroup()

                  val oneP = Cfg.s("panelStyle") == "oneui"
                  val pc = if (oneP) 0xFF1C1C1E.toInt() else Color.WHITE
                  val ov = FrameLayout(this)
                  ov.setBackgroundColor(if (oneP) 0x66000000 else 0xAA000000.toInt())
                  ov.isClickable = true
                  ov.setOnClickListener { closeGroup() }

                  val panelW = (resources.displayMetrics.widthPixels * 0.9f).toInt()
                  val panel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(dp(12), dp(16), dp(12), dp(16))
                      background = if (oneP) rounded(0xF7FFFFFF.toInt(), dp(28)) else rounded(0x99808088.toInt(), dp(30))
                      isClickable = true
                  }
                  val titleV: TextView = if (folder != null) EditText(this) else TextView(this)
                  titleV.apply {
                      text = title
                      textSize = 22f
                      setTextColor(pc)
                      gravity = Gravity.CENTER
                      if (folder != null) {
                          background = null
                          setSingleLine(true)
                          inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_CAP_SENTENCES
                          imeOptions = EditorInfo.IME_ACTION_DONE
                      }
                  }
                  if (folder != null) {
                      (titleV as EditText).doAfterTextChanged { folder.name = it?.toString().orEmpty() }
                  }
                  panel.addView(titleV, LinearLayout.LayoutParams(MATCH, WRAP).apply { bottomMargin = dp(8) })

                  val sv = ScrollView(this)
                  sv.isVerticalScrollBarEnabled = false
                  val g = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  for (chunk in pkgs.chunked(3)) {
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      for (i in 0 until 3) {
                          val a = chunk.getOrNull(i)?.let { apps[it] }
                          val slot = FrameLayout(this)
                          if (a != null) {
                              val cell = LinearLayout(this).apply {
                                  orientation = LinearLayout.VERTICAL
                                  gravity = Gravity.CENTER_HORIZONTAL
                                  setPadding(0, dp(8), 0, dp(4))
                              }
                              val iv = roundIcon(a.icon, iconPx)
                              cell.addView(iv, LinearLayout.LayoutParams(iconPx, iconPx))
                              cell.addView(labelView(a.label, pc), LinearLayout.LayoutParams(MATCH, WRAP))
                              cell.setOnClickListener { launch(a, iv) }
                              cell.setOnLongClickListener {
                                  haptic(it)
                                  appMenu(a.pkg, if (folder != null) Where.FOLDER else Where.LIBRARY, folder)
                                  true
                              }
                              slot.addView(cell, FrameLayout.LayoutParams(WRAP, WRAP, Gravity.CENTER_HORIZONTAL))
                          }
                          row.addView(slot, LinearLayout.LayoutParams(0, WRAP, 1f))
                      }
                      g.addView(row)
                  }
                  sv.addView(g, FrameLayout.LayoutParams(MATCH, WRAP))
                  val maxH = (resources.displayMetrics.heightPixels * 0.55f).toInt()
                  panel.addView(sv, LinearLayout.LayoutParams(MATCH, WRAP).apply { })
                  sv.post {
                      if (sv.height > maxH) {
                          val lp = sv.layoutParams
                          lp.height = maxH
                          sv.layoutParams = lp
                      }
                  }

                  ov.addView(panel, FrameLayout.LayoutParams(panelW, WRAP, Gravity.CENTER))
                  content.addView(ov, FrameLayout.LayoutParams(MATCH, MATCH))
                  ViewCompat.setOnApplyWindowInsetsListener(ov) { v, insets ->
                      val sys = insets.getInsets(WindowInsetsCompat.Type.systemBars())
                      val ime = insets.getInsets(WindowInsetsCompat.Type.ime())
                      v.setPadding(0, 0, 0, Math.max(0, ime.bottom - sys.bottom))
                      insets
                  }
                  groupOverlay = ov
                  groupFolder = folder

                  ov.alpha = 0f
                  panel.alpha = 0f
                  panel.setLayerType(View.LAYER_TYPE_HARDWARE, null)
                  panel.post {
                      if (from != null && from.width > 0 && from.isAttachedToWindow) {
                          val pl = IntArray(2)
                          panel.getLocationOnScreen(pl)
                          val fl = IntArray(2)
                          from.getLocationOnScreen(fl)
                          panel.translationX = (fl[0] + from.width / 2f) - (pl[0] + panel.width / 2f)
                          panel.translationY = (fl[1] + from.height / 2f) - (pl[1] + panel.height / 2f)
                          panel.scaleX = 0.2f
                          panel.scaleY = 0.2f
                      } else {
                          panel.scaleX = 0.85f
                          panel.scaleY = 0.85f
                      }
                      ov.animate().alpha(1f).setDuration(240).start()
                      panel.animate().translationX(0f).translationY(0f).scaleX(1f).scaleY(1f).alpha(1f)
                          .setDuration(340).setInterpolator(springOut)
                          .withEndAction { panel.setLayerType(View.LAYER_TYPE_NONE, null) }
                          .start()
                  }
              }

              private fun closeGroup() {
                  val ov = groupOverlay ?: return
                  hideKeyboard(ov)
                  groupOverlay = null
                  groupFolder = null
                  (ov as? ViewGroup)?.getChildAt(0)?.animate()?.scaleX(0.9f)?.scaleY(0.9f)?.setDuration(180)?.start()
                  ov.animate().alpha(0f).setDuration(180).withEndAction { content.removeView(ov) }.start()
                  normalize()
                  saveAll()
                  rebuild()
              }

              private fun openSearch() {
                  if (searchOverlay != null) return
                  if (groupOverlay != null) closeGroup()

                  val ov = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xEE000000.toInt())
                      setPadding(dp(16), dp(12), dp(16), 0)
                      isClickable = true
                  }
                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val et = searchField("Pesquisar")
                  val cancel = TextView(this).apply {
                      text = "Cancelar"
                      textSize = 16f
                      setTextColor(0xFF0A84FF.toInt())
                      setPadding(dp(14), dp(8), 0, dp(8))
                      setOnClickListener { closeSearch() }
                  }
                  bar.addView(et, LinearLayout.LayoutParams(0, WRAP, 1f))
                  bar.addView(cancel, LinearLayout.LayoutParams(WRAP, WRAP))
                  ov.addView(bar, LinearLayout.LayoutParams(MATCH, WRAP))

                  val shown = mutableListOf<AppItem>()
                  var webQuery = ""
                  val list = ListView(this)
                  list.divider = null
                  list.setSelector(android.R.color.transparent)
                  val adapter = object : BaseAdapter() {
                      override fun getCount() = shown.size + (if (webQuery.isNotEmpty()) 1 else 0)
                      override fun getItem(p: Int): Any = p
                      override fun getItemId(p: Int) = p.toLong()
                      override fun getView(p: Int, convert: View?, parent: ViewGroup): View {
                          if (p < shown.size) return appRow(shown[p], Where.SEARCH)
                          val t = TextView(this@MainActivity)
                          t.text = "Pesquisar na web por “$webQuery”"
                          t.textSize = 16f
                          t.setTextColor(0xFF0A84FF.toInt())
                          t.setPadding(0, dp(14), 0, dp(14))
                          val q = webQuery
                          t.setOnClickListener {
                              try {
                                  startActivity(
                                      Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q=" + Uri.encode(q)))
                                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  )
                                  closeSearch()
                              } catch (_: Exception) {
                              }
                          }
                          return t
                      }
                  }
                  list.adapter = adapter
                  et.doAfterTextChanged { s ->
                      val q = s?.toString().orEmpty().trim()
                      webQuery = q
                      shown.clear()
                      if (q.isNotEmpty()) {
                          shown.addAll(sorted.filter { it.label.contains(q, ignoreCase = true) }.take(12))
                      }
                      adapter.notifyDataSetChanged()
                  }
                  et.setOnEditorActionListener { _, id, _ ->
                      if (id == EditorInfo.IME_ACTION_SEARCH && shown.isNotEmpty()) {
                          launch(shown[0], null)
                          true
                      } else false
                  }
                  ov.addView(list, LinearLayout.LayoutParams(MATCH, 0, 1f).apply { topMargin = dp(8) })

                  content.addView(ov, FrameLayout.LayoutParams(MATCH, MATCH))
                  ViewCompat.setOnApplyWindowInsetsListener(ov) { v, insets ->
                      val sys = insets.getInsets(WindowInsetsCompat.Type.systemBars())
                      val ime = insets.getInsets(WindowInsetsCompat.Type.ime())
                      v.setPadding(dp(16), dp(12), dp(16), Math.max(0, ime.bottom - sys.bottom))
                      insets
                  }
                  searchOverlay = ov
                  ov.alpha = 0f
                  ov.animate().alpha(1f).setDuration(160).start()
                  et.requestFocus()
                  et.postDelayed({
                      val imm = getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager
                      imm.showSoftInput(et, InputMethodManager.SHOW_IMPLICIT)
                  }, 200)
              }

              private fun closeSearch() {
                  val ov = searchOverlay ?: return
                  hideKeyboard(ov)
                  content.removeView(ov)
                  searchOverlay = null
              }

              // ================= Skins e ajustes =================

              private fun todayOn() = Cfg.b("today")
              private fun libOn() = Cfg.b("library")
              private fun firstHome() = if (todayOn()) 1 else 0
              private fun pageCount() = firstHome() + homePages.size + (if (libOn()) 1 else 0)
              private fun isHomePage(p: Int) = p >= firstHome() && p < firstHome() + homePages.size

              private fun haptic(v: View) {
                  v.animate().alpha(1f).scaleX(1f).scaleY(1f).setDuration(120).start()
                  if (Cfg.b("haptics")) v.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
              }

              private fun updateGear() {
                  if (!::gearBtn.isInitialized) return
                  val onFirst = homePages.isNotEmpty() && pager.currentItem == firstHome()
                  gearBtn.visibility = if (Cfg.b("gear") && !editing && onFirst) View.VISIBLE else View.GONE
              }

              private fun glass(pct: Int): Int {
                  val a = pct.coerceIn(0, 100) * 255 / 100
                  return if (Cfg.s("tint") == "dark") Color.argb(a, 0, 0, 0) else Color.argb(a, 255, 255, 255)
              }

              private fun styleChrome() {
                  val bar = Cfg.s("pillStyle") == "bar"
                  val dark = Cfg.s("tint") == "dark"
                  dock.background = rounded(glass(Cfg.i("dockAlpha")), dp(Cfg.i("dockRadius")))
                  if (bar) dock.setPadding(dp(6), dp(10), dp(6), dp(10)) else dock.setPadding(dp(8), dp(12), dp(8), dp(12))
                  dots.visibility = if (Cfg.b("dots")) View.VISIBLE else View.GONE
                  updateGear()
                  content.setBackgroundColor(Color.argb(Cfg.i("dim") * 255 / 100, 0, 0, 0))

                  if (bar) {
                      val sp = SpannableStringBuilder("G    Pesquisar")
                      sp.setSpan(ForegroundColorSpan(0xFF4285F4.toInt()), 0, 1, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                      sp.setSpan(StyleSpan(Typeface.BOLD), 0, 1, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                      pill.text = sp
                      pill.textSize = 15f
                      pill.gravity = Gravity.CENTER_VERTICAL
                      pill.setTextColor(if (dark) Color.WHITE else 0xFF5F6368.toInt())
                      pill.background = rounded(if (dark) 0xE61C1C1E.toInt() else 0xF2FFFFFF.toInt(), dp(26))
                      pill.setPadding(dp(22), 0, dp(22), 0)
                      pill.layoutParams = LinearLayout.LayoutParams(MATCH, dp(50)).apply {
                          setMargins(dp(14), dp(4), dp(14), dp(2))
                      }
                  } else {
                      pill.text = "🔍  Pesquisar"
                      pill.textSize = 13f
                      pill.gravity = Gravity.CENTER
                      pill.setTextColor(Color.WHITE)
                      pill.background = rounded(glass(25), dp(16))
                      pill.setPadding(dp(18), dp(6), dp(18), dp(6))
                      pill.layoutParams = LinearLayout.LayoutParams(WRAP, dp(32)).apply {
                          gravity = Gravity.CENTER_HORIZONTAL
                          bottomMargin = dp(10)
                      }
                  }

                  // Ordem das barras: One UI = busca, bolinhas, dock | iOS = bolinhas, busca, dock
                  column.removeView(pill)
                  column.removeView(dots)
                  if (bar) {
                      column.addView(pill, 1)
                      column.addView(dots, 2)
                  } else {
                      column.addView(dots, 1)
                      column.addView(pill, 2)
                  }
                  dots.setOnLongClickListener {
                      haptic(it)
                      openHomeMenu()
                      true
                  }
                  dock.setOnLongClickListener {
                      haptic(it)
                      openHomeMenu()
                      true
                  }
                  updatePill()
                  buildDock()
              }

              private fun cfgChanged(key: String) {
                  if (key == "shape" || key == "iconSet" || key == "skin") {
                      signature = ""
                      refresh()
                  }
                  if (key == "dockMax" || key == "skin") {
                      while (dockPkgs.size > Cfg.i("dockMax")) {
                          val p = dockPkgs.removeAt(dockPkgs.size - 1)
                          home.add(Entry.App(p))
                      }
                      normalize()
                      saveAll()
                  }
                  styleChrome()
                  rebuild()
                  if (key == "today" || key == "library" || key == "skin") {
                      pager.setCurrentItem(firstHome(), false)
                  }
                  if (key == "skin") settingsList?.let { buildSettings(it) }
              }

              private fun openHomeMenu() {
                  showMenu("Tela de Início") {
                      add("Editar Tela de Início") { setEditing(true) }
                      add("Papéis de parede") {
                          try {
                              startActivity(Intent.createChooser(Intent(Intent.ACTION_SET_WALLPAPER), "Papel de parede"))
                          } catch (_: Exception) {
                          }
                      }
                      add("Ajustes do iLauncher") { openSettings() }
                  }
              }

              // ---------- Tela de ajustes (engrenagem) ----------

              private fun section(list: LinearLayout, title: String): LinearLayout {
                  list.addView(TextView(this).apply {
                      text = title
                      textSize = 13f
                      setTextColor(0xFF6D6D72.toInt())
                      setPadding(dp(16), dp(22), 0, dp(6))
                  }, LinearLayout.LayoutParams(MATCH, WRAP))
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = rounded(Color.WHITE, dp(12))
                  }
                  list.addView(card, LinearLayout.LayoutParams(MATCH, WRAP))
                  return card
              }

              private fun rowBase(card: LinearLayout): LinearLayout {
                  if (card.childCount > 0) {
                      val sep = View(this)
                      sep.setBackgroundColor(0xFFE5E5EA.toInt())
                      card.addView(sep, LinearLayout.LayoutParams(MATCH, 1).apply { leftMargin = dp(16) })
                  }
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(16), dp(12), dp(16), dp(12))
                  }
                  card.addView(row, LinearLayout.LayoutParams(MATCH, WRAP))
                  return row
              }

              private fun rowTitle(t: String): TextView {
                  return TextView(this).apply {
                      text = t
                      textSize = 16f
                      setTextColor(Color.BLACK)
                  }
              }

              private fun rowToggle(card: LinearLayout, title: String, key: String) {
                  val row = rowBase(card)
                  row.addView(rowTitle(title), LinearLayout.LayoutParams(0, WRAP, 1f))
                  val sw = Switch(this)
                  sw.isChecked = Cfg.b(key)
                  sw.setOnCheckedChangeListener { _, on ->
                      Cfg.put(key, on)
                      cfgChanged(key)
                  }
                  row.addView(sw)
              }

              private fun rowChoice(
                  card: LinearLayout, title: String, key: String,
                  options: List<Pair<String, String>>, onPick: ((String) -> Unit)? = null
              ) {
                  val row = rowBase(card)
                  row.addView(rowTitle(title), LinearLayout.LayoutParams(0, WRAP, 1f))
                  val cur = options.firstOrNull { it.first == Cfg.s(key) }?.second ?: ""
                  val valueV = TextView(this).apply {
                      text = "$cur  ›"
                      textSize = 15f
                      setTextColor(0xFF8E8E93.toInt())
                  }
                  row.addView(valueV)
                  row.setOnClickListener {
                      val dlg = AlertDialog.Builder(this, android.R.style.Theme_Material_Light_Dialog_Alert)
                          .setTitle(title)
                          .setItems(options.map { it.second }.toTypedArray()) { _, i ->
                              val v = options[i].first
                              if (onPick != null) {
                                  onPick(v)
                              } else {
                                  Cfg.put(key, v)
                                  cfgChanged(key)
                              }
                              valueV.text = "${options[i].second}  ›"
                          }
                          .create()
                      dlg.show()
                      dlg.window?.setBackgroundDrawable(rounded(0xF5FFFFFF.toInt(), dp(22)))
                  }
              }

              private fun rowSeek(
                  card: LinearLayout, title: String, key: String,
                  min: Int, max: Int, suffix: String, zeroText: String? = null
              ) {
                  val row = rowBase(card)
                  row.orientation = LinearLayout.VERTICAL
                  row.gravity = Gravity.START
                  fun fmt(v: Int): String = if (zeroText != null && v == 0) zeroText else "$v$suffix"
                  val head = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val valueV = TextView(this).apply {
                      textSize = 15f
                      setTextColor(0xFF8E8E93.toInt())
                      text = fmt(Cfg.i(key))
                  }
                  head.addView(rowTitle(title), LinearLayout.LayoutParams(0, WRAP, 1f))
                  head.addView(valueV)
                  row.addView(head, LinearLayout.LayoutParams(MATCH, WRAP))
                  val sb = SeekBar(this)
                  sb.max = max - min
                  sb.progress = (Cfg.i(key) - min).coerceIn(0, max - min)
                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          valueV.text = fmt(p + min)
                      }

                      override fun onStartTrackingTouch(s: SeekBar?) {}

                      override fun onStopTrackingTouch(s: SeekBar?) {
                          Cfg.put(key, (s?.progress ?: 0) + min)
                          cfgChanged(key)
                      }
                  })
                  row.addView(sb, LinearLayout.LayoutParams(MATCH, WRAP))
              }

              private fun rowAction(card: LinearLayout, title: String, action: () -> Unit) {
                  val row = rowBase(card)
                  row.addView(TextView(this).apply {
                      text = title
                      textSize = 16f
                      setTextColor(0xFF0A84FF.toInt())
                  }, LinearLayout.LayoutParams(0, WRAP, 1f))
                  row.setOnClickListener { action() }
              }

              private fun buildSettings(list: LinearLayout) {
                  list.removeAllViews()

                  var c = section(list, "SKIN (APARÊNCIA COMPLETA)")
                  rowChoice(c, "Skin do launcher", "skin", Cfg.SKINS) { name ->
                      Cfg.applySkin(name)
                      cfgChanged("skin")
                  }

                  c = section(list, "ÍCONES")
                  rowChoice(
                      c, "Estilo dos ícones", "iconSet",
                      listOf("ios" to "Estilo iOS", "oneui" to "Estilo One UI", "original" to "Ícones originais")
                  )
                  rowChoice(
                      c, "Formato", "shape",
                      listOf(
                          "squircle" to "Squircle (iOS)", "round" to "Quadrado arredondado",
                          "circle" to "Círculo", "square" to "Quadrado"
                      )
                  )
                  rowSeek(c, "Tamanho do ícone", "iconSize", 50, 90, "%")
                  rowSeek(c, "Colunas", "cols", 3, 6, "")
                  rowSeek(c, "Linhas", "rows", 0, 8, "", "Automático")
                  rowToggle(c, "Mostrar nomes dos apps", "labels")
                  rowSeek(c, "Tamanho do nome", "labelSize", 9, 14, "")
                  rowChoice(
                      c, "Estilo das pastas", "folderStyle",
                      listOf("grid3" to "3×3 (iOS)", "grid2" to "2×2 (One UI)")
                  )

                  c = section(list, "DOCK E BARRAS")
                  rowToggle(c, "Mostrar dock", "dock")
                  rowSeek(c, "Arredondamento do dock", "dockRadius", 0, 40, "")
                  rowChoice(
                      c, "Estilo do painel de pastas", "panelStyle",
                      listOf("ios" to "Vidro cinza (iOS)", "oneui" to "Cartão branco (One UI)")
                  )
                  rowSeek(c, "Apps no dock", "dockMax", 3, 6, "")
                  rowSeek(c, "Transparência do dock", "dockAlpha", 0, 100, "%")
                  rowChoice(c, "Cor do vidro", "tint", listOf("light" to "Claro", "dark" to "Escuro"))
                  rowToggle(c, "Botão de pesquisa", "pill")
                  rowChoice(
                      c, "Estilo da pesquisa", "pillStyle",
                      listOf("ios" to "Botão pequeno (iOS)", "bar" to "Barra larga (One UI)")
                  )
                  rowToggle(c, "Bolinhas das páginas", "dots")
                  rowSeek(c, "Escurecer o fundo", "dim", 0, 60, "%")
                  rowToggle(c, "Mostrar a engrenagem na tela", "gear")

                  c = section(list, "PÁGINAS")
                  rowToggle(c, "Página Hoje (Samsung Free)", "today")
                  rowToggle(c, "Biblioteca de Apps", "library")
                  rowToggle(c, "Relógio grande na página Hoje", "wClock")
                  rowToggle(c, "Widget de calendário", "wCal")
                  rowToggle(c, "Widget de bateria", "wBat")
                  rowToggle(c, "Widget de armazenamento", "wSto")
                  rowToggle(c, "Atalhos para as configurações", "wLinks")
                  rowToggle(c, "Medidor de temperatura", "wTemp")

                  c = section(list, "FUNÇÕES E GESTOS")
                  rowToggle(c, "Deslizar para baixo abre a pesquisa", "swipeSearch")
                  rowToggle(c, "Deslizar para cima abre a gaveta de apps", "drawerGesture")
                  rowToggle(c, "Criar pasta arrastando app sobre app", "folders")
                  rowToggle(c, "Ícones balançando ao editar", "wiggle")
                  rowToggle(c, "Vibração ao segurar", "haptics")
                  rowChoice(
                      c, "Estilo das animações", "animStyle",
                      listOf("ios" to "iPhone", "oneui" to "One UI (Samsung)")
                  )
                  rowToggle(c, "Animação ao abrir apps", "animLaunch")
                  rowToggle(c, "Animação ao tocar", "animPress")
                  rowToggle(c, "Efeito ao trocar de página", "animPage")

                  c = section(list, "GERENCIAR")
                  rowAction(c, "Apps ocultos...") {
                      val l = hidden.mapNotNull { apps[it] }
                      if (l.isEmpty()) {
                          Toast.makeText(this, "Nenhum app oculto", Toast.LENGTH_SHORT).show()
                      } else {
                          showMenu("Toque para mostrar de novo") {
                              for (a in l) add(a.label) { addToHome(a.pkg) }
                          }
                      }
                  }
                  rowAction(c, "Organizar apps em ordem alfabética") {
                      showMenu("Isso desfaz as pastas") {
                          add("Organizar") {
                              val l = mutableListOf<Entry>()
                              for (a in sorted) {
                                  if (a.pkg !in dockPkgs && a.pkg !in hidden) l.add(Entry.App(a.pkg))
                              }
                              home = l
                              commit()
                          }
                          add("Cancelar") {}
                      }
                  }
                  rowAction(c, "Restaurar layout padrão") {
                      showMenu("Apagar pastas, ordem e dock?") {
                          add("Restaurar") {
                              store.reset()
                              syncLayout()
                              rebuild()
                          }
                          add("Cancelar") {}
                      }
                  }
                  rowAction(c, "Restaurar todos os ajustes") {
                      Cfg.applySkin("ios")
                      cfgChanged("skin")
                  }
                  rowAction(c, "Definir como launcher padrão") {
                      try {
                          startActivity(Intent(Settings.ACTION_HOME_SETTINGS))
                      } catch (_: Exception) {
                      }
                  }
                  rowAction(c, "Ajustes do Android") {
                      try {
                          startActivity(Intent(Settings.ACTION_SETTINGS))
                      } catch (_: Exception) {
                      }
                  }
              }

              private fun openSettings() {
                  if (settingsOverlay != null) return
                  if (searchOverlay != null) closeSearch()
                  if (groupOverlay != null) closeGroup()
                  if (drawerOverlay != null) closeDrawer()

                  val ov = FrameLayout(this)
                  ov.setBackgroundColor(0xFFF2F2F7.toInt())
                  ov.isClickable = true
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }

                  val bar = FrameLayout(this)
                  bar.addView(TextView(this).apply {
                      text = "Ajustes do iLauncher"
                      textSize = 18f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.BLACK)
                      gravity = Gravity.CENTER
                  }, FrameLayout.LayoutParams(MATCH, WRAP, Gravity.CENTER))
                  bar.addView(TextView(this).apply {
                      text = "Concluído"
                      textSize = 16f
                      setTextColor(0xFF0A84FF.toInt())
                      setPadding(dp(16), dp(14), dp(16), dp(14))
                      setOnClickListener { closeSettings() }
                  }, FrameLayout.LayoutParams(WRAP, WRAP, Gravity.END or Gravity.CENTER_VERTICAL))
                  col.addView(bar, LinearLayout.LayoutParams(MATCH, dp(52)))

                  val sv = ScrollView(this)
                  val list = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), 0, dp(16), dp(32))
                  }
                  sv.addView(list, FrameLayout.LayoutParams(MATCH, WRAP))
                  settingsList = list
                  buildSettings(list)
                  col.addView(sv, LinearLayout.LayoutParams(MATCH, 0, 1f))
                  ov.addView(col, FrameLayout.LayoutParams(MATCH, MATCH))
                  content.addView(ov, FrameLayout.LayoutParams(MATCH, MATCH))
                  settingsOverlay = ov
                  ov.alpha = 0f
                  ov.translationY = dp(40).toFloat()
                  ov.animate().alpha(1f).translationY(0f).setDuration(220)
                      .setInterpolator(DecelerateInterpolator()).start()
              }

              private fun closeSettings() {
                  val ov = settingsOverlay ?: return
                  settingsOverlay = null
                  settingsList = null
                  content.removeView(ov)
                  styleChrome()
                  rebuild()
              }

              // ---------- Gaveta de apps (deslizar para cima, estilo One UI) ----------

              private fun drawerCell(a: AppItem, color: Int): View {
                  val cell = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(0, dp(8), 0, dp(4))
                  }
                  val iv = roundIcon(a.icon, iconPx)
                  cell.addView(iv, LinearLayout.LayoutParams(iconPx, iconPx))
                  if (Cfg.b("labels")) cell.addView(labelView(a.label, color), LinearLayout.LayoutParams(MATCH, WRAP))
                  cell.setOnClickListener { launch(a, iv) }
                  cell.setOnLongClickListener {
                      haptic(it)
                      appMenu(a.pkg, Where.LIBRARY)
                      true
                  }
                  pressable(cell)
                  return cell
              }

              private fun openDrawer() {
                  if (drawerOverlay != null) return
                  if (searchOverlay != null) closeSearch()
                  if (groupOverlay != null) closeGroup()
                  val dark = Cfg.s("tint") == "dark"
                  val txt = if (dark) Color.WHITE else 0xFF1C1C1E.toInt()

                  val ov = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(if (dark) 0xF0121212.toInt() else 0xF2F5F5F7.toInt())
                      setPadding(dp(8), dp(8), dp(8), 0)
                      isClickable = true
                  }
                  val handle = View(this)
                  handle.background = rounded(if (dark) 0x66FFFFFF else 0x55000000, dp(3))
                  handle.setOnClickListener { closeDrawer() }
                  ov.addView(handle, LinearLayout.LayoutParams(dp(40), dp(5)).apply {
                      gravity = Gravity.CENTER_HORIZONTAL
                      topMargin = dp(6)
                      bottomMargin = dp(10)
                  })

                  val et = EditText(this).apply {
                      hint = "Pesquisar apps"
                      setHintTextColor(if (dark) 0xAAFFFFFF.toInt() else 0x99000000.toInt())
                      setTextColor(txt)
                      isSingleLine = true
                      inputType = InputType.TYPE_CLASS_TEXT
                      setPadding(dp(18), dp(10), dp(18), dp(10))
                      background = rounded(if (dark) 0x33FFFFFF else 0x14000000, dp(24))
                  }
                  ov.addView(et, LinearLayout.LayoutParams(MATCH, WRAP).apply {
                      setMargins(dp(8), 0, dp(8), dp(8))
                  })

                  val sv = ScrollView(this)
                  sv.isVerticalScrollBarEnabled = false
                  val grid = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  sv.addView(grid, FrameLayout.LayoutParams(MATCH, WRAP))
                  ov.addView(sv, LinearLayout.LayoutParams(MATCH, 0, 1f))

                  fun fill(q: String) {
                      grid.removeAllViews()
                      val l = if (q.isEmpty()) sorted else sorted.filter { it.label.contains(q, ignoreCase = true) }
                      val n = COLS
                      val cellW = resources.displayMetrics.widthPixels / n - dp(10)
                      for (chunk in l.chunked(n)) {
                          val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                          for (i in 0 until n) {
                              val a = chunk.getOrNull(i)
                              val slot = FrameLayout(this)
                              if (a != null) {
                                  slot.addView(
                                      drawerCell(a, txt),
                                      FrameLayout.LayoutParams(cellW, WRAP, Gravity.TOP or Gravity.CENTER_HORIZONTAL)
                                  )
                              }
                              row.addView(slot, LinearLayout.LayoutParams(0, WRAP, 1f))
                          }
                          grid.addView(row)
                      }
                  }
                  fill("")
                  et.doAfterTextChanged { fill(it?.toString().orEmpty().trim()) }

                  content.addView(ov, FrameLayout.LayoutParams(MATCH, MATCH))
                  ViewCompat.setOnApplyWindowInsetsListener(ov) { v, insets ->
                      val sys = insets.getInsets(WindowInsetsCompat.Type.systemBars())
                      val ime = insets.getInsets(WindowInsetsCompat.Type.ime())
                      v.setPadding(dp(8), dp(8), dp(8), Math.max(0, ime.bottom - sys.bottom))
                      insets
                  }
                  drawerOverlay = ov
                  drawerScroll = sv
                  val h = if (content.height > 0) content.height.toFloat() else dp(600).toFloat()
                  ov.translationY = h
                  ov.animate().translationY(0f).setDuration(280)
                      .setInterpolator(DecelerateInterpolator(1.4f)).start()
              }

              private fun closeDrawer() {
                  val ov = drawerOverlay ?: return
                  drawerOverlay = null
                  drawerScroll = null
                  hideKeyboard(ov)
                  ov.animate().translationY(content.height.toFloat()).setDuration(220)
                      .setInterpolator(DecelerateInterpolator())
                      .withEndAction { content.removeView(ov) }
                      .start()
              }

              // ================= Pager =================

              private class VH(v: View) : RecyclerView.ViewHolder(v)

              private inner class PageAdapter : RecyclerView.Adapter<VH>() {
                  override fun getItemCount() = pageCount()
                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                      val f = FrameLayout(parent.context)
                      f.layoutParams = ViewGroup.LayoutParams(MATCH, MATCH)
                      return VH(f)
                  }

                  override fun onBindViewHolder(holder: VH, position: Int) {
                      val f = holder.itemView as FrameLayout
                      f.scaleX = 1f
                      f.scaleY = 1f
                      f.alpha = 1f
                      f.removeAllViews()
                      val page = when {
                          todayOn() && position == 0 -> buildToday()
                          libOn() && position == firstHome() + homePages.size -> buildLibrary()
                          else -> buildHomePage(position - firstHome())
                      }
                      f.addView(page, FrameLayout.LayoutParams(MATCH, MATCH))
                  }
              }
          }
          EOF_FILE

      - name: Compilar APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - name: Renomear APK
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk iLauncher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: iLauncher-APK
          path: iLauncher.apk

      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: iLauncher v${{ github.run_number }}
          files: iLauncher.apk
