          data class AppItem(
              val label: String,
              val pkg: String,
              val intent: Intent,
              val icon: Drawable,
              val category: String
          )

          private enum class Where { HOME, DOCK, FOLDER, LIBRARY, SEARCH }

          private class OptionList {
              val titles = mutableListOf<String>()
              val actions = mutableListOf<() -> Unit>()
              fun add(title: String, action: () -> Unit) {
                  titles.add(title)
                  actions.add(action)
              }
          }

          class MainActivity : Activity() {

              private val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
              private val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT
              private val COLS = 4
              private val CATEGORIES = listOf(
                  "Social", "Entretenimento", "Foto e Vídeo", "Produtividade",
                  "Finanças", "Viagens", "Notícias", "Jogos", "Utilidades"
              )

              private lateinit var pager: ViewPager2
              private lateinit var dots: LinearLayout
              private lateinit var pill: TextView
              private lateinit var dock: LinearLayout
              private lateinit var content: FrameLayout
              private lateinit var doneBtn: TextView
              private lateinit var store: Store
              private lateinit var detector: GestureDetector

              private var apps = LinkedHashMap<String, AppItem>()
              private var sorted = listOf<AppItem>()
              private var home = mutableListOf<Entry>()
              private var dockPkgs = mutableListOf<String>()
              private var hidden = mutableSetOf<String>()
              private var homePages = listOf<List<Entry>>()
              private var rows = 5
              private var editing = false
              private var positioned = false
              @Volatile private var loaded = false
              @Volatile private var signature = ""
              private var maxPagerH = 0
              private var refreshGen = 0
              private val bg = java.util.concurrent.Executors.newSingleThreadExecutor()
              private var dragEntry: Entry? = null
              private var dragSource: View? = null
              private var lastFlip = 0L
              private var groupOverlay: View? = null
              private var groupFolder: Entry.Folder? = null
              private var searchOverlay: View? = null
              private var launchOverlay: ImageView? = null

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private val iconPx get() = (resources.displayMetrics.widthPixels / COLS * 0.72f).toInt()
              private fun cellH() = iconPx + dp(8) + dp(22) + dp(14)

              private fun rounded(color: Int, r: Int): GradientDrawable =
                  GradientDrawable().apply {
                      cornerRadius = r.toFloat()
                      setColor(color)
                  }

              // ================= Ciclo de vida =================

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  store = Store(this)
                  WindowCompat.setDecorFitsSystemWindows(window, false)

                  content = FrameLayout(this)
                  ViewCompat.setOnApplyWindowInsetsListener(content) { v, insets ->
                      val sys = insets.getInsets(WindowInsetsCompat.Type.systemBars())
                      v.setPadding(0, sys.top, 0, sys.bottom)
                      insets
                  }

                  val column = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }

                  pager = ViewPager2(this)
                  (pager.getChildAt(0) as? RecyclerView)?.overScrollMode = View.OVER_SCROLL_NEVER
                  pager.adapter = PageAdapter()
                  pager.offscreenPageLimit = 1
                  pager.setPageTransformer { page, position ->
                      val a = Math.min(Math.abs(position), 1f)
                      val sc = 1f - 0.06f * a
                      page.scaleX = sc
                      page.scaleY = sc
                  }
                  pager.registerOnPageChangeCallback(object : ViewPager2.OnPageChangeCallback() {
                      override fun onPageSelected(position: Int) {
                          updateDots(position)
                          updatePill()
                      }

                      override fun onPageScrollStateChanged(state: Int) {
                          val rv = pager.getChildAt(0) as? RecyclerView ?: return
                          val layer = if (state != ViewPager2.SCROLL_STATE_IDLE && !editing) {
                              View.LAYER_TYPE_HARDWARE
                          } else {
                              View.LAYER_TYPE_NONE
                          }
                          for (i in 0 until rv.childCount) rv.getChildAt(i).setLayerType(layer, null)
                      }
                  })
                  pager.addOnLayoutChangeListener { _, _, t, _, b, _, ot, _, ob ->
                      if (b - t != ob - ot) applyGrid()
                  }
                  column.addView(pager, LinearLayout.LayoutParams(MATCH, 0, 1f))

                  dots = LinearLayout(this).apply { gravity = Gravity.CENTER }
                  column.addView(dots, LinearLayout.LayoutParams(MATCH, dp(20)))

                  pill = TextView(this).apply {
                      text = "🔍  Pesquisar"
                      textSize = 13f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      background = rounded(0x40FFFFFF, dp(16))
                      setPadding(dp(18), dp(6), dp(18), dp(6))
                      setOnClickListener { openSearch() }
                  }
                  column.addView(pill, LinearLayout.LayoutParams(WRAP, dp(32)).apply {
                      gravity = Gravity.CENTER_HORIZONTAL
                      bottomMargin = dp(10)
                  })

                  dock = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      setPadding(dp(8), dp(12), dp(8), dp(12))
                      background = rounded(0x55FFFFFF, dp(34))
                  }
                  column.addView(dock, LinearLayout.LayoutParams(MATCH, WRAP).apply {
                      setMargins(dp(10), 0, dp(10), dp(8))
                  })

                  content.addView(column, FrameLayout.LayoutParams(MATCH, MATCH))

                  doneBtn = TextView(this).apply {
                      text = "OK"
                      textSize = 15f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.WHITE)
                      background = rounded(0x66000000, dp(16))
                      setPadding(dp(18), dp(6), dp(18), dp(6))
                      visibility = View.GONE
                      setOnClickListener { setEditing(false) }
                  }
                  content.addView(doneBtn, FrameLayout.LayoutParams(WRAP, WRAP, Gravity.TOP or Gravity.END).apply {
                      setMargins(0, dp(6), dp(16), 0)
                  })

                  setContentView(content)

                  detector = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onFling(e1: MotionEvent?, e2: MotionEvent, vx: Float, vy: Float): Boolean {
                          if (e1 == null) return false
                          val dy = e2.y - e1.y
                          val dx = e2.x - e1.x
                          val p = pager.currentItem
                          if (!editing && searchOverlay == null && groupOverlay == null &&
                              p >= 1 && p <= homePages.size &&
                              dy > dp(100) && Math.abs(dy) > Math.abs(dx) * 1.5f && vy > 800f
                          ) {
                              openSearch()
                          }
                          return false
                      }
                  })
              }

              override fun onDestroy() {
                  super.onDestroy()
                  bg.shutdown()
              }

              override fun dispatchTouchEvent(ev: MotionEvent): Boolean {
                  detector.onTouchEvent(ev)
                  return super.dispatchTouchEvent(ev)
              }

              override fun onResume() {
                  super.onResume()
                  dismissLaunch(true)
                  refresh()
                  // Fix: rebuild total apos voltar de um app para limpar
                  // qualquer estado de animacao (escala/alpha) preso nos icones.
                  if (loaded) pager.postDelayed({ pager.adapter?.notifyDataSetChanged() }, 300)
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  when {
                      searchOverlay != null -> closeSearch()
                      groupOverlay != null -> closeGroup()
                      editing -> setEditing(false)
                      else -> pager.setCurrentItem(1, true)
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  when {
                      searchOverlay != null -> closeSearch()
                      groupOverlay != null -> closeGroup()
                      editing -> setEditing(false)
                      pager.currentItem != 1 -> pager.setCurrentItem(1, true)
                  }
              }

              // ================= Dados =================

              private fun categoryOf(ai: ApplicationInfo?, pkg: String): String {
                  when (ai?.category) {
                      ApplicationInfo.CATEGORY_GAME -> return "Jogos"
                      ApplicationInfo.CATEGORY_AUDIO, ApplicationInfo.CATEGORY_VIDEO -> return "Entretenimento"
                      ApplicationInfo.CATEGORY_IMAGE -> return "Foto e Vídeo"
                      ApplicationInfo.CATEGORY_SOCIAL -> return "Social"
                      ApplicationInfo.CATEGORY_NEWS -> return "Notícias"
                      ApplicationInfo.CATEGORY_MAPS -> return "Viagens"
                      ApplicationInfo.CATEGORY_PRODUCTIVITY -> return "Produtividade"
                  }
                  val p = pkg.lowercase()
                  return when {
                      listOf("camera", "gallery", "photo", "galer").any { p.contains(it) } -> "Foto e Vídeo"
                      listOf("whatsapp", "telegram", "facebook", "instagram", "twitter", "messag", "mms",
                          "dialer", "contacts", "tiktok", "snapchat", "discord").any { p.contains(it) } -> "Social"
                      listOf("youtube", "netflix", "spotify", "music", "video", "player", "disney").any { p.contains(it) } -> "Entretenimento"
                      listOf("maps", "uber", "booking", "airbnb", "travel").any { p.contains(it) } -> "Viagens"
                      listOf("bank", "nubank", "wallet", "finance", "itau", "bradesco", "santander").any { p.contains(it) } -> "Finanças"
                      listOf("office", "docs", "drive", "mail", "calendar", "notes", "keep").any { p.contains(it) } -> "Produtividade"
                      else -> "Utilidades"
                  }
              }

              private fun refresh() {
                  val gen = ++refreshGen
                  bg.execute {
                      try {
                          val pm = packageManager
                          val main = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                          val list = pm.queryIntentActivities(main, 0)
                              .filter { it.activityInfo.packageName != packageName }
                          if (list.isEmpty() && loaded) return@execute
                          val sig = list.map { it.activityInfo.packageName }.distinct().sorted().joinToString("|")
                          if (loaded && sig == signature) return@execute
                          val m = LinkedHashMap<String, AppItem>()
                          for (ri in list) {
                              val pk = ri.activityInfo.packageName
                              if (m.containsKey(pk)) continue
                              val label = ri.loadLabel(pm).toString()
                              val icon = Icons.build(label, pk, ri.loadIcon(pm))
                              // Fix: nao chamar prepare() em todos os apps. O IosIcon
                              // renderiza sob demanda no primeiro draw(); preparar todos
                              // consumia ~147KB de bitmap por app e estourava a memoria.
                              m[pk] = AppItem(
                                  label,
                                  pk,
                                  Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                                      .setClassName(pk, ri.activityInfo.name)
                                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED),
                                  icon,
                                  categoryOf(ri.activityInfo.applicationInfo, pk)
                              )
                          }
                          runOnUiThread { if (gen == refreshGen) applyApps(m, sig) }
                      } catch (_: Exception) {
                      }
                  }
              }

              private fun applyApps(m: LinkedHashMap<String, AppItem>, sig: String) {
                  signature = sig
                  apps = m
                  sorted = m.values.sortedBy { it.label.lowercase() }
                  syncLayout()
                  loaded = true
                  applyGrid()
                  rebuild()
              }

              private fun autoDock(): List<String> {
                  val pm = packageManager
                  val probes = listOf(
                      Intent(Intent.ACTION_DIAL),
                      Intent(Intent.ACTION_SENDTO, Uri.parse("smsto:")),
                      Intent(Intent.ACTION_VIEW, Uri.parse("https://example.com")),
                      Intent(MediaStore.ACTION_IMAGE_CAPTURE)
                  )
                  return probes
                      .mapNotNull { pm.resolveActivity(it, PackageManager.MATCH_DEFAULT_ONLY)?.activityInfo?.packageName }
                      .distinct()
              }

              private fun syncLayout() {
                  home = store.loadHome()
                  hidden = store.loadHidden().filter { apps.containsKey(it) }.toMutableSet()
                  val saved = store.loadDock()
                  dockPkgs = (saved ?: autoDock()).filter { apps.containsKey(it) }.distinct().take(4).toMutableList()

                  val seen = HashSet<String>()
                  val cleaned = mutableListOf<Entry>()
                  for (e in home) {
                      when (e) {
                          is Entry.App -> {
                              if (apps.containsKey(e.pkg) && e.pkg !in dockPkgs && e.pkg !in hidden && seen.add(e.pkg)) {
                                  cleaned.add(e)
                              }
                          }
                          is Entry.Folder -> {
                              e.pkgs.retainAll { apps.containsKey(it) && it !in dockPkgs && it !in hidden && seen.add(it) }
                              if (e.pkgs.isNotEmpty()) cleaned.add(e)
                          }
                      }
                  }
                  for (a in sorted) {
                      if (a.pkg !in seen && a.pkg !in dockPkgs && a.pkg !in hidden) {
                          cleaned.add(Entry.App(a.pkg))
                          seen.add(a.pkg)
                      }
                  }
                  home = cleaned
                  normalize()
                  saveAll()
              }

              private fun normalize() {
                  val out = mutableListOf<Entry>()
                  for (e in home) {
                      when (e) {
                          is Entry.App -> out.add(e)
                          is Entry.Folder -> {
                              if (e.pkgs.size == 1) out.add(Entry.App(e.pkgs[0]))
                              else if (e.pkgs.size > 1) out.add(e)
                          }
                      }
                  }
                  home = out
              }

              private fun saveAll() {
                  store.saveHome(home)
                  store.saveDock(dockPkgs)
                  store.saveHidden(hidden)
              }

              private fun commit() {
                  normalize()
                  saveAll()
                  rebuild()
              }

              private fun applyGrid() {
                  if (pager.height > maxPagerH) maxPagerH = pager.height
                  val h = maxPagerH
                  val newRows = if (h > 0) ((h - dp(16)) / cellH()).coerceIn(3, 6) else rows
                  if (newRows != rows || homePages.isEmpty()) {
                      rows = newRows
                      if (loaded) rebuild()
                  }
              }

              private fun rebuild() {
                  val per = COLS * rows
                  homePages = home.chunked(per).ifEmpty { listOf(emptyList<Entry>()) }
                  pager.adapter?.notifyDataSetChanged()
                  // Fix: manter apenas a pagina atual + vizinhas em memoria.
                  // Antes ate 5 paginas extras ficavam vivas, multiplicando o
                  // numero de views e bitmaps carregados.
                  pager.offscreenPageLimit = 1
                  if (!positioned && loaded) {
                      pager.setCurrentItem(1, false)
                      positioned = true
                  }
                  buildDock()
                  updateDots(pager.currentItem)
                  updatePill()
              }

              // ================= Operações =================

              private fun removeFromHome(pkg: String) {
                  home = home.filterNot { it is Entry.App && it.pkg == pkg }.toMutableList()
                  for (e in home) if (e is Entry.Folder) e.pkgs.remove(pkg)
                  normalize()
              }

              private fun hideApp(pkg: String) {
                  removeFromHome(pkg)
                  dockPkgs.remove(pkg)
                  hidden.add(pkg)
                  commit()
              }

              private fun addToHome(pkg: String) {
                  hidden.remove(pkg)
                  removeFromHome(pkg)
                  home.add(Entry.App(pkg))
                  commit()
              }

              private fun dockApp(pkg: String) {
                  removeFromHome(pkg)
                  hidden.remove(pkg)
                  if (dockPkgs.size < 4 && pkg !in dockPkgs) dockPkgs.add(pkg)
                  commit()
              }

              private fun undock(pkg: String) {
                  dockPkgs.remove(pkg)
                  home.add(Entry.App(pkg))
                  commit()
              }

              private fun takeOutOfFolder(pkg: String, f: Entry.Folder) {
                  closeGroup()
                  f.pkgs.remove(pkg)
                  home.add(Entry.App(pkg))
                  commit()
              }

              private fun uninstall(pkg: String) {
                  try {
                      startActivity(Intent(Intent.ACTION_DELETE, Uri.parse("package:$pkg")))
                  } catch (_: Exception) {
                      Toast.makeText(this, "Não foi possível apagar", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun appInfo(pkg: String) {
                  try {
                      startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:$pkg")))
                  } catch (_: Exception) {
                  }
              }

              private fun startApp(a: AppItem, opts: Bundle?) {
                  try {
                      startActivity(a.intent, opts)
                  } catch (_: Exception) {
                      Toast.makeText(this, "Não foi possível abrir", Toast.LENGTH_SHORT).show()
                      dismissLaunch(false)
                      return
                  }
                  if (searchOverlay != null) closeSearch()
                  if (groupOverlay != null) closeGroup()
              }

              private fun launch(a: AppItem, v: View?) {
                  val opts = ActivityOptions.makeCustomAnimation(
                      this, android.R.anim.fade_in, android.R.anim.fade_out
                  ).toBundle()
                  if (v == null || v.width == 0 || launchOverlay != null) {
                      startApp(a, opts)
                      return
                  }
                  val cl = IntArray(2)
                  content.getLocationOnScreen(cl)
                  val vl = IntArray(2)
                  v.getLocationOnScreen(vl)
                  val iv = ImageView(this)
                  iv.setImageDrawable(a.icon)
                  iv.scaleType = ImageView.ScaleType.FIT_XY
                  val lp = FrameLayout.LayoutParams(v.width, v.height)
                  lp.leftMargin = vl[0] - cl[0] - content.paddingLeft
                  lp.topMargin = vl[1] - cl[1] - content.paddingTop
                  content.addView(iv, lp)
                  launchOverlay = iv
                  val big = resources.displayMetrics.widthPixels * 1.15f / v.width
                  iv.animate().scaleX(big).scaleY(big).setDuration(240)
                      .setInterpolator(DecelerateInterpolator(1.3f))
                      .start()
                  iv.postDelayed({ startApp(a, opts) }, 90)
                  iv.postDelayed({ if (launchOverlay === iv) dismissLaunch(true) }, 3000)
              }

              private fun dismissLaunch(animate: Boolean) {
                  val iv = launchOverlay ?: return
                  launchOverlay = null
                  if (animate) {
                      iv.animate().scaleX(1f).scaleY(1f).alpha(0f).setDuration(280)
                          .setInterpolator(DecelerateInterpolator())
                          .withEndAction { content.removeView(iv) }
                          .start()
                  } else {
                      content.removeView(iv)
                  }
              }

              private fun setEditing(on: Boolean) {
                  editing = on
                  doneBtn.visibility = if (on) View.VISIBLE else View.GONE
                  if (!on) {
                      normalize()
                      saveAll()
                  }
                  rebuild()
              }

              private fun showMenu(title: String, build: OptionList.() -> Unit) {
                  val o = OptionList()
                  o.build()
                  val dlg = AlertDialog.Builder(this, android.R.style.Theme_Material_Light_Dialog_Alert)
                      .setTitle(title)
                      .setItems(o.titles.toTypedArray()) { _, i -> o.actions[i]() }
                      .create()
                  dlg.show()
                  dlg.window?.setBackgroundDrawable(rounded(0xF5FFFFFF.toInt(), dp(22)))
              }

              private fun appMenu(pkg: String, where: Where, folder: Entry.Folder? = null) {
                  val a = apps[pkg] ?: return
                  val onHome = home.any { (it is Entry.App && it.pkg == pkg) || (it is Entry.Folder && pkg in it.pkgs) }
                  showMenu(a.label) {
                      if (onHome || where == Where.DOCK) add("Editar Tela de Início") {
                          closeGroup()
                          setEditing(true)
                      }
                      if (where == Where.DOCK) add("Tirar do Dock") { undock(pkg) }
                      else if (pkg !in dockPkgs && dockPkgs.size < 4) add("Colocar no Dock") { dockApp(pkg) }
                      if (where == Where.FOLDER && folder != null) add("Tirar da pasta") { takeOutOfFolder(pkg, folder) }
                      if (onHome) add("Remover da Tela de Início") { hideApp(pkg) }
                      else if (pkg !in dockPkgs) add("Adicionar à Tela de Início") { addToHome(pkg) }
                      add("Informações do app") { appInfo(pkg) }
                      add("Apagar app") { uninstall(pkg) }
                  }
              }

              private fun folderMenu(f: Entry.Folder) {
                  showMenu(f.name) {
                      add("Editar Tela de Início") { setEditing(true) }
                      add("Renomear") { openGroup(f.name, f.pkgs.toList(), f) }
                  }
              }

              // ================= Ícones =================

              private fun roundIcon(d: Drawable, size: Int): ImageView {
                  return ImageView(this).apply {
                      setImageDrawable(d)
                      scaleType = ImageView.ScaleType.FIT_XY
                  }
              }

              private fun pressable(v: View) {
                  // Fix: cancela a animacao anterior antes de iniciar uma nova.
                  // Sem isso, DOWN/UP rapidos deixavam a escala presa (ex.: 0.9)
                  // quando a proxima animacao era enfileirada sobre a anterior.
                  v.setOnTouchListener { view, ev ->
                      when (ev.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              view.animate().cancel()
                              view.animate().scaleX(0.9f).scaleY(0.9f).setDuration(90)
                                  .setInterpolator(DecelerateInterpolator()).start()
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              view.animate().cancel()
                              view.animate().scaleX(1f).scaleY(1f).setDuration(280)
                                  .setInterpolator(OvershootInterpolator(2.5f)).start()
                          }
                      }
                      false
                  }
              }

              private fun folderIconView(f: Entry.Folder): View {
                  val box = FrameLayout(this)
                  box.background = rounded(0x66FFFFFF, (iconPx * 0.225f).toInt())
                  val pad = (iconPx * 0.1f).toInt()
                  val mini = (iconPx * 0.22f).toInt()
                  val grid = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad, pad, pad)
                  }
                  val items = f.pkgs.take(9)
                  for (r in 0 until 3) {
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      for (c in 0 until 3) {
                          val a = items.getOrNull(r * 3 + c)?.let { apps[it] }
                          val v: View = if (a != null) roundIcon(a.icon, mini) else View(this)
                          row.addView(v, LinearLayout.LayoutParams(mini, mini).apply { setMargins(1, 1, 1, 1) })
                      }
                      grid.addView(row)
                  }
                  box.addView(grid, FrameLayout.LayoutParams(MATCH, MATCH))
                  return box
              }

              private fun wiggle(v: View) {
                  val a = ObjectAnimator.ofFloat(v, View.ROTATION, -2.2f, 2.2f).apply {
                      duration = 100L + (Math.random() * 40).toLong()
                      repeatCount = ValueAnimator.INFINITE
                      repeatMode = ValueAnimator.REVERSE
                      startDelay = (Math.random() * 100).toLong()
                  }
                  v.addOnAttachStateChangeListener(object : View.OnAttachStateChangeListener {
                      override fun onViewAttachedToWindow(view: View) {
                          if (!a.isStarted) a.start()
                      }

                      override fun onViewDetachedFromWindow(view: View) {
                          a.cancel()
                      }
                  })
                  v.setLayerType(View.LAYER_TYPE_HARDWARE, null)
                  if (v.isAttachedToWindow) a.start()
              }

              private fun labelView(text: String): TextView {
                  return TextView(this).apply {
                      this.text = text
                      textSize = 11.5f
                      typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                      setTextColor(Color.WHITE)
                      setShadowLayer(4f, 0f, 1f, 0x99000000.toInt())
                      maxLines = 1
                      ellipsize = TextUtils.TruncateAt.END
                      gravity = Gravity.CENTER
                      setPadding(dp(2), dp(5), dp(2), 0)
                  }
              }

              private fun entryCell(e: Entry): View {
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(0, dp(8), 0, 0)
                  }
                  val holder = FrameLayout(this)
                  val name: String
                  when (e) {
                      is Entry.App -> {
                          val a = apps[e.pkg] ?: return View(this)
                          holder.addView(roundIcon(a.icon, iconPx), FrameLayout.LayoutParams(iconPx, iconPx))
                          name = a.label
                          if (editing) {
                              val badge = TextView(this).apply {
                                  text = "−"
                                  textSize = 15f
                                  typeface = Typeface.DEFAULT_BOLD
                                  setTextColor(Color.WHITE)
                                  gravity = Gravity.CENTER
                                  background = GradientDrawable().apply {
                                      shape = GradientDrawable.OVAL
                                      setColor(0xFF8E8E93.toInt())
                                  }
                                  setOnClickListener {
                                      showMenu(a.label) {
                                          add("Remover da Tela de Início") { hideApp(a.pkg) }
                                          add("Apagar app") { uninstall(a.pkg) }
                                      }
                                  }
                              }
                              holder.addView(badge, FrameLayout.LayoutParams(dp(22), dp(22), Gravity.TOP or Gravity.START))
                          }
                      }
                      is Entry.Folder -> {
                          holder.addView(folderIconView(e), FrameLayout.LayoutParams(iconPx, iconPx))
                          name = e.name
                      }
                  }
                  col.addView(holder, LinearLayout.LayoutParams(iconPx, iconPx))
                  col.addView(labelView(name), LinearLayout.LayoutParams(MATCH, WRAP))

                  col.setOnClickListener { v ->
                      if (!editing) {
                          when (e) {
                              is Entry.App -> apps[e.pkg]?.let { launch(it, holder) }
                              is Entry.Folder -> openGroup(e.name, e.pkgs.toList(), e)
                          }
                      }
                  }
                  col.setOnLongClickListener { v ->
                      v.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                      if (editing) {
                          startDrag(v, e)
                      } else {
                          when (e) {
                              is Entry.App -> appMenu(e.pkg, Where.HOME)
                              is Entry.Folder -> folderMenu(e)
                          }
                      }
                      true
                  }
                  pressable(col)
                  if (editing) wiggle(col)
                  return col
              }

              // ================= Arrastar e soltar =================

              private fun startDrag(v: View, e: Entry) {
                  dragEntry = e
                  dragSource = v
                  v.alpha = 0.3f
                  v.startDragAndDrop(ClipData.newPlainText("e", "e"), View.DragShadowBuilder(v), null, 0)
              }

              private fun maybeFlip(v: View, ev: DragEvent) {
                  val now = System.currentTimeMillis()
                  if (now - lastFlip < 800) return
                  val loc = IntArray(2)
                  v.getLocationOnScreen(loc)
                  val x = loc[0] + ev.x
                  val w = resources.displayMetrics.widthPixels
                  val cur = pager.currentItem
                  if (x < dp(28) && cur > 1) {
                      pager.setCurrentItem(cur - 1, true)
                      lastFlip = now
                  } else if (x > w - dp(28) && cur < homePages.size) {
                      pager.setCurrentItem(cur + 1, true)
                      lastFlip = now
                  }
              }

              private fun slotListener(target: Entry?, hp: Int): View.OnDragListener {
                  return View.OnDragListener { v, ev ->
                      when (ev.action) {
                          DragEvent.ACTION_DRAG_STARTED -> dragEntry != null
                          DragEvent.ACTION_DRAG_LOCATION -> {
                              maybeFlip(v, ev)
                              true
                          }
                          DragEvent.ACTION_DROP -> {
                              val w = if (v.width > 0) v.width else 1
                              val zone = when {
                                  ev.x < w * 0.25f -> -1
                                  ev.x > w * 0.75f -> 1
                                  else -> 0
                              }
                              val d = dragEntry
                              v.post { handleDrop(d, target, zone, hp) }
                              true
                          }
                          DragEvent.ACTION_DRAG_ENDED -> {
                              // Fix: quando o arraste e cancelado (sem drop),
                              // o Android nao entrega ACTION_UP ao touch listener
                              // do icone de origem; sem isso a view ficava com
                              // alpha 0.3 e escala 0.9 (ou algum valor intermediario).
                              dragSource?.let { src ->
                                  src.alpha = 1f
                                  src.animate().cancel()
                                  src.scaleX = 1f
                                  src.scaleY = 1f
                              }
                              dragSource = null
                              dragEntry = null
                              true
                          }
                          else -> true
                      }
                  }
              }

              private fun handleDrop(d: Entry?, target: Entry?, zone: Int, hp: Int) {
                  if (d == null || d === target) {
                      rebuild()
                      return
                  }
                  val per = COLS * rows
                  val dIdx = home.indexOfFirst { it === d }
                  if (dIdx < 0) {
                      rebuild()
                      return
                  }
                  if (target == null) {
                      var tIdx = Math.min(home.size, (hp + 1) * per)
                      home.removeAt(dIdx)
                      if (dIdx < tIdx) tIdx--
                      home.add(tIdx.coerceIn(0, home.size), d)
                  } else {
                      val tIdx = home.indexOfFirst { it === target }
                      if (tIdx < 0) {
                          rebuild()
                          return
                      }
                      if (zone == 0 && d is Entry.App && target is Entry.App) {
                          home[tIdx] = Entry.Folder("Pasta", mutableListOf(target.pkg, d.pkg))
                          home.removeAt(dIdx)
                      } else if (zone == 0 && d is Entry.App && target is Entry.Folder) {
                          target.pkgs.add(d.pkg)
                          home.removeAt(dIdx)
                      } else {
                          home.removeAt(dIdx)
                          val n = home.indexOfFirst { it === target }
                          home.add(if (zone < 0) n else n + 1, d)
                      }
                  }
                  commit()
              }

              // ================= Páginas =================

              private fun buildHomePage(hp: Int): View {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(8), dp(8), dp(8), 0)
                  }
                  val items = homePages.getOrNull(hp) ?: emptyList()
                  for (r in 0 until rows) {
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      root.addView(row, LinearLayout.LayoutParams(MATCH, 0, 1f))
                      for (c in 0 until COLS) {
                          val slot = FrameLayout(this)
                          val e = items.getOrNull(r * COLS + c)
                          if (e != null) {
                              slot.addView(
                                  entryCell(e),
                                  FrameLayout.LayoutParams(
                                      resources.displayMetrics.widthPixels / COLS - dp(6),
                                      WRAP,
                                      Gravity.TOP or Gravity.CENTER_HORIZONTAL
                                  )
                              )
                          }
                          if (editing) slot.setOnDragListener(slotListener(e, hp))
                          row.addView(slot, LinearLayout.LayoutParams(0, MATCH, 1f))
                      }
                  }
                  return root
              }

              private fun buildDock() {
                  dock.removeAllViews()
                  for (pk in dockPkgs) {
                      val a = apps[pk] ?: continue
                      val frame = FrameLayout(this)
                      val iv = roundIcon(a.icon, iconPx)
                      pressable(iv)
                      iv.setOnClickListener { launch(a, iv) }
                      iv.setOnLongClickListener {
                          it.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                          appMenu(a.pkg, Where.DOCK)
                          true
                      }
                      frame.addView(iv, FrameLayout.LayoutParams(iconPx, iconPx, Gravity.CENTER))
                      dock.addView(frame, LinearLayout.LayoutParams(0, WRAP, 1f))
                  }
                  dock.visibility = if (dockPkgs.isEmpty()) View.GONE else View.VISIBLE
              }

              private fun updateDots(selected: Int) {
                  val total = homePages.size + 2
                  if (dots.childCount != total) {
                      dots.removeAllViews()
                      for (i in 0 until total) {
                          val d = View(this)
                          d.background = GradientDrawable().apply {
                              shape = GradientDrawable.OVAL
                              setColor(0x66FFFFFF)
                          }
                          dots.addView(d, LinearLayout.LayoutParams(dp(7), dp(7)).apply {
                              setMargins(dp(4), 0, dp(4), 0)
                          })
                      }
                  }
                  for (i in 0 until total) {
                      val bg = dots.getChildAt(i).background as GradientDrawable
                      bg.setColor(if (i == selected) Color.WHITE else 0x66FFFFFF)
                  }
              }

              private fun updatePill() {
                  val p = pager.currentItem
                  pill.visibility = if (!editing && p >= 1 && p <= homePages.size) View.VISIBLE else View.INVISIBLE
              }

              // ---------- Hoje (widgets) ----------

              private fun bar(pct: Int, color: Int): View {
                  val track = LinearLayout(this)
                  track.weightSum = 100f
                  track.background = rounded(0x33FFFFFF, dp(4))
                  val fill = View(this)
                  fill.background = rounded(color, dp(4))
                  track.addView(fill, LinearLayout.LayoutParams(0, MATCH, pct.coerceIn(1, 100).toFloat()))
                  return track
              }

              private fun tv(text: String, size: Float, color: Int, bold: Boolean = false): TextView {
                  return TextView(this).apply {
                      this.text = text
                      textSize = size
                      setTextColor(color)
                      if (bold) typeface = Typeface.DEFAULT_BOLD
                  }
              }

              private fun buildToday(): View {
                  val w = resources.displayMetrics.widthPixels
                  val gap = dp(12)
                  val side = (w - dp(32) - gap) / 2

                  val sv = ScrollView(this)
                  sv.isVerticalScrollBarEnabled = false
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(8), dp(16), dp(16))
                  }
                  sv.addView(col, FrameLayout.LayoutParams(MATCH, WRAP))

                  col.addView(TextClock(this).apply {
                      format24Hour = "HH:mm"
                      format12Hour = "h:mm"
                      textSize = 56f
                      typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                      setTextColor(Color.WHITE)
                      setShadowLayer(6f, 0f, 1f, 0x66000000)
                  }, LinearLayout.LayoutParams(MATCH, WRAP))
                  col.addView(TextClock(this).apply {
                      format24Hour = "EEEE, d 'de' MMMM"
                      format12Hour = "EEEE, d 'de' MMMM"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      setShadowLayer(6f, 0f, 1f, 0x66000000)
                  }, LinearLayout.LayoutParams(MATCH, WRAP))

                  val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }

                  // Calendário
                  val now = Date()
                  val cal = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = rounded(Color.WHITE, dp(22))
                      setPadding(dp(16), dp(14), dp(16), dp(14))
                  }
                  cal.addView(tv(
                      java.text.SimpleDateFormat("EEEE", Locale.getDefault()).format(now).uppercase(),
                      13f, 0xFFFF3B30.toInt(), true
                  ))
                  cal.addView(tv(
                      java.text.SimpleDateFormat("d", Locale.getDefault()).format(now),
                      58f, 0xFF111111.toInt()
                  ).apply { typeface = Typeface.create("sans-serif-light", Typeface.NORMAL) })
                  cal.addView(tv(
                      java.text.SimpleDateFormat("MMMM yyyy", Locale.getDefault()).format(now),
                      13f, 0xFF6B6B6B.toInt()
                  ))
                  row.addView(cal, LinearLayout.LayoutParams(side, side))

                  // Bateria
                  val bi = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val level = bi?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                  val scale = bi?.getIntExtra(BatteryManager.EXTRA_SCALE, 100) ?: 100
                  val pct = if (level >= 0 && scale > 0) level * 100 / scale else 0
                  val st = bi?.getIntExtra(BatteryManager.EXTRA_STATUS, -1) ?: -1
                  val charging = st == BatteryManager.BATTERY_STATUS_CHARGING || st == BatteryManager.BATTERY_STATUS_FULL
                  val bat = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = rounded(0x99000000.toInt(), dp(22))
                      setPadding(dp(16), dp(14), dp(16), dp(14))
                  }
                  bat.addView(tv("Bateria", 13f, 0xFFBBBBBB.toInt(), true))
                  bat.addView(tv("$pct%", 40f, Color.WHITE).apply {
                      typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                  })
                  bat.addView(tv(if (charging) "Carregando" else "Em uso", 13f, 0xFFBBBBBB.toInt()))
                  bat.addView(
                      bar(pct, if (pct < 20 && !charging) 0xFFFF3B30.toInt() else 0xFF34C759.toInt()),
                      LinearLayout.LayoutParams(MATCH, dp(8)).apply { topMargin = dp(12) }
                  )
                  row.addView(bat, LinearLayout.LayoutParams(side, side).apply { leftMargin = gap })
                  col.addView(row, LinearLayout.LayoutParams(MATCH, WRAP).apply { topMargin = dp(16) })

                  // Armazenamento
                  var used = 0.0
                  var total = 1.0
                  try {
                      val sf = StatFs(Environment.getDataDirectory().path)
                      total = sf.blockCountLong.toDouble() * sf.blockSizeLong / 1073741824.0
                      val free = sf.availableBlocksLong.toDouble() * sf.blockSizeLong / 1073741824.0
                      used = total - free
                  } catch (_: Exception) {
                  }
                  val sto = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = rounded(0x99000000.toInt(), dp(22))
                      setPadding(dp(16), dp(14), dp(16), dp(14))
                  }
                  sto.addView(tv("Armazenamento", 13f, 0xFFBBBBBB.toInt(), true))
                  sto.addView(tv("%.1f GB de %.0f GB".format(used, total), 22f, Color.WHITE))
                  sto.addView(
                      bar((used / total * 100).toInt(), 0xFF0A84FF.toInt()),
                      LinearLayout.LayoutParams(MATCH, dp(8)).apply { topMargin = dp(12) }
                  )
                  col.addView(sto, LinearLayout.LayoutParams(MATCH, WRAP).apply { topMargin = gap })
                  return sv
              }

              // ---------- Biblioteca de Apps ----------

              private fun searchField(hintText: String): EditText {
                  return EditText(this).apply {
                      hint = hintText
                      setHintTextColor(0xAAFFFFFF.toInt())
                      setTextColor(Color.WHITE)
                      inputType = InputType.TYPE_CLASS_TEXT
                      isSingleLine = true
                      imeOptions = EditorInfo.IME_ACTION_SEARCH
                      setPadding(dp(16), dp(10), dp(16), dp(10))
                      background = rounded(0x44FFFFFF, dp(14))
                  }
              }

              // Fix: aceita convert para reaproveitar a view do ListView (evita
              // churn de views/GC — antes cada scroll criava novas fileiras).
              private fun appRow(a: AppItem, where: Where, convert: View? = null): View {
                  val row = (convert as? LinearLayout) ?: LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(6), 0, dp(6))
                      val sz = dp(48)
                      addView(
                          ImageView(this@MainActivity).apply { scaleType = ImageView.ScaleType.FIT_XY },
                          LinearLayout.LayoutParams(sz, sz)
                      )
                      addView(
                          TextView(this@MainActivity).apply {
                              textSize = 17f
                              setTextColor(Color.WHITE)
                              setPadding(dp(14), 0, 0, 0)
                          },
                          LinearLayout.LayoutParams(0, WRAP, 1f)
                      )
                  }
                  val iv = row.getChildAt(0) as ImageView
                  val tv = row.getChildAt(1) as TextView
                  iv.setImageDrawable(a.icon)
                  tv.text = a.label
                  row.setOnClickListener { launch(a, row) }
                  row.setOnLongClickListener {
                      appMenu(a.pkg, where)
                      true
                  }
                  return row
              }

              private fun categoryTile(title: String, list: List<AppItem>, tileW: Int): View {
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val padding = dp(12)
                  val inner = tileW - padding * 2
                  val gapPx = dp(10)
                  val mini = (inner - gapPx) / 2

                  fun slot(i: Int): View {
                      if (i == 3 && list.size > 4) {
                          val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                          val tiny = (mini - dp(4)) / 2
                          val rest = list.drop(3).take(4)
                          for (r in 0 until 2) {
                              val rr = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                              for (c in 0 until 2) {
                                  val a = rest.getOrNull(r * 2 + c)
                                  val v: View = if (a != null) roundIcon(a.icon, tiny) else View(this)
                                  rr.addView(v, LinearLayout.LayoutParams(tiny, tiny).apply { setMargins(1, 1, 1, 1) })
                              }
                              box.addView(rr)
                          }
                          box.setOnClickListener { openGroup(title, list.map { it.pkg }, null) }
                          return box
                      }
                      val a = list.getOrNull(i) ?: return View(this)
                      val iv = roundIcon(a.icon, mini)
                      pressable(iv)
                      iv.setOnClickListener { launch(a, iv) }
                      iv.setOnLongClickListener {
                          appMenu(a.pkg, Where.LIBRARY)
                          true
                      }
                      return iv
                  }

                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = rounded(0x44FFFFFF, dp(24))
                      setPadding(padding, padding, padding, padding)
                  }
                  for (r in 0 until 2) {
                      val rr = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      for (c in 0 until 2) {
                          rr.addView(slot(r * 2 + c), LinearLayout.LayoutParams(mini, mini).apply {
                              if (c == 0) rightMargin = gapPx
                              if (r == 0) bottomMargin = gapPx
                          })
                      }
                      card.addView(rr)
                  }
                  col.addView(card, LinearLayout.LayoutParams(tileW, WRAP))
                  col.addView(TextView(this).apply {
                      text = title
                      textSize = 12f
                      setTextColor(Color.WHITE)
                      setPadding(dp(6), dp(5), 0, dp(14))
                  })
                  return col
              }

              private fun buildLibrary(): View {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0x55000000)
                      setPadding(dp(16), dp(12), dp(16), 0)
                  }
                  ViewCompat.setOnApplyWindowInsetsListener(root) { v, insets ->
                      val sys = insets.getInsets(WindowInsetsCompat.Type.systemBars())
                      val ime = insets.getInsets(WindowInsetsCompat.Type.ime())
                      val below = (pager.parent as View).height - pager.height
                      v.setPadding(dp(16), dp(12), dp(16), Math.max(0, ime.bottom - sys.bottom - below))
                      insets
                  }
                  val search = searchField("Biblioteca de Apps")
                  root.addView(search, LinearLayout.LayoutParams(MATCH, WRAP))

                  val tileW = (resources.displayMetrics.widthPixels - dp(32) - dp(14)) / 2
                  val scroll = ScrollView(this)
                  scroll.isVerticalScrollBarEnabled = false
                  val grid = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, dp(14), 0, dp(12))
                  }
                  scroll.addView(grid, FrameLayout.LayoutParams(MATCH, WRAP))

                  val groups = sorted.groupBy { it.category }
                  val tiles = CATEGORIES.filter { groups.containsKey(it) }
                  for (i in tiles.indices step 2) {
                      val r = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      r.addView(categoryTile(tiles[i], groups[tiles[i]]!!, tileW))
                      if (i + 1 < tiles.size) {
                          r.addView(
                              categoryTile(tiles[i + 1], groups[tiles[i + 1]]!!, tileW),
                              LinearLayout.LayoutParams(tileW, WRAP).apply { leftMargin = dp(14) }
                          )
                      }
                      grid.addView(r)
                  }

                  val shown = mutableListOf<AppItem>()
                  val list = ListView(this)
                  list.divider = null
                  list.setSelector(android.R.color.transparent)
                  list.visibility = View.GONE
                  val adapter = object : BaseAdapter() {
                      override fun getCount() = shown.size
                      override fun getItem(p: Int): Any = shown[p]
                      override fun getItemId(p: Int) = p.toLong()
                      override fun getView(p: Int, convert: View?, parent: ViewGroup): View =
                          appRow(shown[p], Where.LIBRARY, convert)
                  }
                  list.adapter = adapter

                  search.doAfterTextChanged { s ->
                      val q = s?.toString().orEmpty().trim()
                      if (q.isEmpty()) {
                          scroll.visibility = View.VISIBLE
                          list.visibility = View.GONE
                      } else {
                          shown.clear()
                          shown.addAll(sorted.filter { it.label.contains(q, ignoreCase = true) })
                          adapter.notifyDataSetChanged()
                          scroll.visibility = View.GONE
                          list.visibility = View.VISIBLE
                      }
                  }
                  root.addView(scroll, LinearLayout.LayoutParams(MATCH, 0, 1f))
                  root.addView(list, LinearLayout.LayoutParams(MATCH, 0, 1f))
                  return root
              }

              // ================= Overlays =================

              private fun hideKeyboard(v: View) {
                  val imm = getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager
                  imm.hideSoftInputFromWindow(v.windowToken, 0)
              }

              private fun openGroup(title: String, pkgs: List<String>, folder: Entry.Folder?) {
                  if (searchOverlay != null) closeSearch()
                  if (groupOverlay != null) closeGroup()

                  val ov = FrameLayout(this)
                  ov.setBackgroundColor(0xAA000000.toInt())
                  ov.isClickable = true
                  ov.setOnClickListener { closeGroup() }

                  val panelW = (resources.displayMetrics.widthPixels * 0.9f).toInt()
                  val panel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(dp(12), dp(16), dp(12), dp(16))
                      background = rounded(0xCC3A3A3C.toInt(), dp(30))
                      isClickable = true
                  }
                  val titleV: TextView = if (folder != null) EditText(this) else TextView(this)
                  titleV.apply {
                      text = title
                      textSize = 22f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      if (folder != null) {
                          background = null
                          setSingleLine(true)
                          inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_CAP_SENTENCES
                          imeOptions = EditorInfo.IME_ACTION_DONE
                      }
                  }
                  if (folder != null) {
                      (titleV as EditText).doAfterTextChanged { folder.name = it?.toString().orEmpty() }
                  }
                  panel.addView(titleV, LinearLayout.LayoutParams(MATCH, WRAP).apply { bottomMargin = dp(8) })

                  val sv = ScrollView(this)
                  sv.isVerticalScrollBarEnabled = false
                  val g = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  for (chunk in pkgs.chunked(3)) {
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      for (i in 0 until 3) {
                          val a = chunk.getOrNull(i)?.let { apps[it] }
                          val slot = FrameLayout(this)
                          if (a != null) {
                              val cell = LinearLayout(this).apply {
                                  orientation = LinearLayout.VERTICAL
                                  gravity = Gravity.CENTER_HORIZONTAL
                                  setPadding(0, dp(8), 0, dp(4))
                              }
                              val iv = roundIcon(a.icon, iconPx)
                              cell.addView(iv, LinearLayout.LayoutParams(iconPx, iconPx))
                              cell.addView(labelView(a.label), LinearLayout.LayoutParams(MATCH, WRAP))
                              cell.setOnClickListener { launch(a, iv) }
                              cell.setOnLongClickListener {
                                  it.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                                  appMenu(a.pkg, if (folder != null) Where.FOLDER else Where.LIBRARY, folder)
                                  true
                              }
                              slot.addView(cell, FrameLayout.LayoutParams(WRAP, WRAP, Gravity.CENTER_HORIZONTAL))
                          }
                          row.addView(slot, LinearLayout.LayoutParams(0, WRAP, 1f))
                      }
                      g.addView(row)
                  }
                  sv.addView(g, FrameLayout.LayoutParams(MATCH, WRAP))
                  val maxH = (resources.displayMetrics.heightPixels * 0.55f).toInt()
                  panel.addView(sv, LinearLayout.LayoutParams(MATCH, WRAP).apply { })
                  sv.post {
                      if (sv.height > maxH) {
                          val lp = sv.layoutParams
                          lp.height = maxH
                          sv.layoutParams = lp
                      }
                  }

                  ov.addView(panel, FrameLayout.LayoutParams(panelW, WRAP, Gravity.CENTER))
                  content.addView(ov, FrameLayout.LayoutParams(MATCH, MATCH))
                  ViewCompat.setOnApplyWindowInsetsListener(ov) { v, insets ->
                      val sys = insets.getInsets(WindowInsetsCompat.Type.systemBars())
                      val ime = insets.getInsets(WindowInsetsCompat.Type.ime())
                      v.setPadding(0, 0, 0, Math.max(0, ime.bottom - sys.bottom))
                      insets
                  }
                  groupOverlay = ov
                  groupFolder = folder

                  ov.alpha = 0f
                  panel.scaleX = 0.85f
                  panel.scaleY = 0.85f
                  panel.setLayerType(View.LAYER_TYPE_HARDWARE, null)
                  ov.animate().alpha(1f).setDuration(180).start()
                  panel.animate().scaleX(1f).scaleY(1f).setDuration(280)
                      .setInterpolator(OvershootInterpolator(1.1f))
                      .withEndAction { panel.setLayerType(View.LAYER_TYPE_NONE, null) }
                      .start()
              }

              private fun closeGroup() {
                  val ov = groupOverlay ?: return
                  hideKeyboard(ov)
                  content.removeView(ov)
                  groupOverlay = null
                  groupFolder = null
                  normalize()
                  saveAll()
                  rebuild()
              }

              private fun openSearch() {
                  if (searchOverlay != null) return
                  if (groupOverlay != null) closeGroup()

                  val ov = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xEE000000.toInt())
                      setPadding(dp(16), dp(12), dp(16), 0)
                      isClickable = true
                  }
                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val et = searchField("Pesquisar")
                  val cancel = TextView(this).apply {
                      text = "Cancelar"
                      textSize = 16f
                      setTextColor(0xFF0A84FF.toInt())
                      setPadding(dp(14), dp(8), 0, dp(8))
                      setOnClickListener { closeSearch() }
                  }
                  bar.addView(et, LinearLayout.LayoutParams(0, WRAP, 1f))
                  bar.addView(cancel, LinearLayout.LayoutParams(WRAP, WRAP))
                  ov.addView(bar, LinearLayout.LayoutParams(MATCH, WRAP))

                  val shown = mutableListOf<AppItem>()
                  var webQuery = ""
                  val list = ListView(this)
                  list.divider = null
                  list.setSelector(android.R.color.transparent)
                  val adapter = object : BaseAdapter() {
                      override fun getCount() = shown.size + (if (webQuery.isNotEmpty()) 1 else 0)
                      override fun getItem(p: Int): Any = p
                      override fun getItemId(p: Int) = p.toLong()
                      override fun getView(p: Int, convert: View?, parent: ViewGroup): View {
                          if (p < shown.size) return appRow(shown[p], Where.SEARCH, convert)
                          val t = (convert as? TextView) ?: TextView(this@MainActivity)
                          t.text = "Pesquisar na web por “$webQuery”"
                          t.textSize = 16f
                          t.setTextColor(0xFF0A84FF.toInt())
                          t.setPadding(0, dp(14), 0, dp(14))
                          val q = webQuery
                          t.setOnClickListener {
                              try {
                                  startActivity(
                                      Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q=" + Uri.encode(q)))
                                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  )
                                  closeSearch()
                              } catch (_: Exception) {
                              }
                          }
                          return t
                      }
                  }
                  list.adapter = adapter
                  et.doAfterTextChanged { s ->
                      val q = s?.toString().orEmpty().trim()
                      webQuery = q
                      shown.clear()
                      if (q.isNotEmpty()) {
                          shown.addAll(sorted.filter { it.label.contains(q, ignoreCase = true) }.take(12))
                      }
                      adapter.notifyDataSetChanged()
                  }
                  et.setOnEditorActionListener { _, id, _ ->
                      if (id == EditorInfo.IME_ACTION_SEARCH && shown.isNotEmpty()) {
                          launch(shown[0], null)
                          true
                      } else false
                  }
                  ov.addView(list, LinearLayout.LayoutParams(MATCH, 0, 1f).apply { topMargin = dp(8) })

                  content.addView(ov, FrameLayout.LayoutParams(MATCH, MATCH))
                  ViewCompat.setOnApplyWindowInsetsListener(ov) { v, insets ->
                      val sys = insets.getInsets(WindowInsetsCompat.Type.systemBars())
                      val ime = insets.getInsets(WindowInsetsCompat.Type.ime())
                      v.setPadding(dp(16), dp(12), dp(16), Math.max(0, ime.bottom - sys.bottom))
                      insets
                  }
                  searchOverlay = ov
                  ov.alpha = 0f
                  ov.animate().alpha(1f).setDuration(160).start()
                  et.requestFocus()
                  et.postDelayed({
                      val imm = getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager
                      imm.showSoftInput(et, InputMethodManager.SHOW_IMPLICIT)
                  }, 200)
              }

              private fun closeSearch() {
                  val ov = searchOverlay ?: return
                  hideKeyboard(ov)
                  content.removeView(ov)
                  searchOverlay = null
              }

              // ================= Pager =================

              private class VH(v: View) : RecyclerView.ViewHolder(v)

              private inner class PageAdapter : RecyclerView.Adapter<VH>() {
                  override fun getItemCount() = homePages.size + 2
                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                      val f = FrameLayout(parent.context)
                      f.layoutParams = ViewGroup.LayoutParams(MATCH, MATCH)
                      return VH(f)
                  }

                  override fun onBindViewHolder(holder: VH, position: Int) {
                      val f = holder.itemView as FrameLayout
                      f.removeAllViews()
                      val page = when {
                          position == 0 -> buildToday()
                          position == homePages.size + 1 -> buildLibrary()
                          else -> buildHomePage(position - 1)
                      }
                      f.addView(page, FrameLayout.LayoutParams(MATCH, MATCH))
                  }
              }
          }
          EOF_FILE

      - name: Compilar APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - name: Renomear APK
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk iLauncher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: iLauncher-APK
          path: iLauncher.apk

      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: iLauncher v${{ github.run_number }}
          files: iLauncher.apk
