              private fun bar(pct: Int, color: Int): View {
                  val track = LinearLayout(this)
                  track.weightSum = 100f
                  track.background = rounded(0x33FFFFFF, dp(4))
                  val fill = View(this)
                  fill.background = rounded(color, dp(4))
                  track.addView(fill, LinearLayout.LayoutParams(0, MATCH, pct.coerceIn(1, 100).toFloat()))
                  return track
              }

              private fun tv(text: String, size: Float, color: Int, bold: Boolean = false): TextView {
                  return TextView(this).apply {
                      this.text = text
                      textSize = size
                      setTextColor(color)
                      if (bold) typeface = Typeface.DEFAULT_BOLD
                  }
              }

              private fun buildToday(): View {
                  val w = resources.displayMetrics.widthPixels
                  val gap = dp(12)
                  val side = (w - dp(32) - gap) / 2

                  val sv = ScrollView(this)
                  sv.isVerticalScrollBarEnabled = false
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(8), dp(16), dp(16))
                  }
                  sv.addView(col, FrameLayout.LayoutParams(MATCH, WRAP))

                  col.addView(TextClock(this).apply {
                      format24Hour = "HH:mm"
                      format12Hour = "h:mm"
                      textSize = 56f
                      typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                      setTextColor(Color.WHITE)
                      setShadowLayer(6f, 0f, 1f, 0x66000000)
                  }, LinearLayout.LayoutParams(MATCH, WRAP))
                  col.addView(TextClock(this).apply {
                      format24Hour = "EEEE, d 'de' MMMM"
                      format12Hour = "EEEE, d 'de' MMMM"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      setShadowLayer(6f, 0f, 1f, 0x66000000)
                  }, LinearLayout.LayoutParams(MATCH, WRAP))

                  val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }

                  // Calendário
                  val now = Date()
                  val cal = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = rounded(Color.WHITE, dp(22))
                      setPadding(dp(16), dp(14), dp(16), dp(14))
                  }
                  cal.addView(tv(
                      java.text.SimpleDateFormat("EEEE", Locale.getDefault()).format(now).uppercase(),
                      13f, 0xFFFF3B30.toInt(), true
                  ))
                  cal.addView(tv(
                      java.text.SimpleDateFormat("d", Locale.getDefault()).format(now),
                      58f, 0xFF111111.toInt()
                  ).apply { typeface = Typeface.create("sans-serif-light", Typeface.NORMAL) })
                  cal.addView(tv(
                      java.text.SimpleDateFormat("MMMM yyyy", Locale.getDefault()).format(now),
                      13f, 0xFF6B6B6B.toInt()
                  ))
                  row.addView(cal, LinearLayout.LayoutParams(side, side))

                  // Bateria
                  val bi = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val level = bi?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                  val scale = bi?.getIntExtra(BatteryManager.EXTRA_SCALE, 100) ?: 100
                  val pct = if (level >= 0 && scale > 0) level * 100 / scale else 0
                  val st = bi?.getIntExtra(BatteryManager.EXTRA_STATUS, -1) ?: -1
                  val charging = st == BatteryManager.BATTERY_STATUS_CHARGING || st == BatteryManager.BATTERY_STATUS_FULL
                  val bat = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = rounded(0x99000000.toInt(), dp(22))
                      setPadding(dp(16), dp(14), dp(16), dp(14))
                  }
                  bat.addView(tv("Bateria", 13f, 0xFFBBBBBB.toInt(), true))
                  bat.addView(tv("$pct%", 40f, Color.WHITE).apply {
                      typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                  })
                  bat.addView(tv(if (charging) "Carregando" else "Em uso", 13f, 0xFFBBBBBB.toInt()))
                  bat.addView(
                      bar(pct, if (pct < 20 && !charging) 0xFFFF3B30.toInt() else 0xFF34C759.toInt()),
                      LinearLayout.LayoutParams(MATCH, dp(8)).apply { topMargin = dp(12) }
                  )
                  row.addView(bat, LinearLayout.LayoutParams(side, side).apply { leftMargin = gap })
                  col.addView(row, LinearLayout.LayoutParams(MATCH, WRAP).apply { topMargin = dp(16) })

                  // Armazenamento
                  var used = 0.0
                  var total = 1.0
                  try {
                      val sf = StatFs(Environment.getDataDirectory().path)
                      total = sf.blockCountLong.toDouble() * sf.blockSizeLong / 1073741824.0
                      val free = sf.availableBlocksLong.toDouble() * sf.blockSizeLong / 1073741824.0
                      used = total - free
                  } catch (_: Exception) {
                  }
                  val sto = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = rounded(0x99000000.toInt(), dp(22))
                      setPadding(dp(16), dp(14), dp(16), dp(14))
                  }
                  sto.addView(tv("Armazenamento", 13f, 0xFFBBBBBB.toInt(), true))
                  sto.addView(tv("%.1f GB de %.0f GB".format(used, total), 22f, Color.WHITE))
                  sto.addView(
                      bar((used / total * 100).toInt(), 0xFF0A84FF.toInt()),
                      LinearLayout.LayoutParams(MATCH, dp(8)).apply { topMargin = dp(12) }
                  )
                  col.addView(sto, LinearLayout.LayoutParams(MATCH, WRAP).apply { topMargin = gap })
                  return sv
              }

