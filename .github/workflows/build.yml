              private fun categoryTile(title: String, list: List<AppItem>, tileW: Int): View {
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val padding = dp(12)
                  val inner = tileW - padding * 2
                  val gapPx = dp(10)
                  val mini = (inner - gapPx) / 2

                  fun slot(i: Int): View {
                      if (i == 3 && list.size > 4) {
                          val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                          val tiny = (mini - dp(4)) / 2
                          val rest = list.drop(3).take(4)
                          for (r in 0 until 2) {
                              val rr = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                              for (c in 0 until 2) {
                                  val a = rest.getOrNull(r * 2 + c)
                                  val v: View = if (a != null) roundIcon(a.icon, tiny) else View(this)
                                  rr.addView(v, LinearLayout.LayoutParams(tiny, tiny).apply { setMargins(1, 1, 1, 1) })
                              }
                              box.addView(rr)
                          }
                          box.setOnClickListener { openGroup(title, list.map { it.pkg }, null) }
                          return box
                      }
                      val a = list.getOrNull(i) ?: return View(this)
                      val iv = roundIcon(a.icon, mini)
                      iv.setOnClickListener { launch(a, iv) }
                      iv.setOnLongClickListener {
                          appMenu(a.pkg, Where.LIBRARY)
                          true
                      }
                      return iv
                  }

                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = rounded(0x44FFFFFF, dp(24))
                      setPadding(padding, padding, padding, padding)
                  }
                  for (r in 0 until 2) {
                      val rr = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      for (c in 0 until 2) {
                          rr.addView(slot(r * 2 + c), LinearLayout.LayoutParams(mini, mini).apply {
                              if (c == 0) rightMargin = gapPx
                              if (r == 0) bottomMargin = gapPx
                          })
                      }
                      card.addView(rr)
                  }
                  col.addView(card, LinearLayout.LayoutParams(tileW, WRAP))
                  col.addView(TextView(this).apply {
                      text = title
                      textSize = 12f
                      setTextColor(Color.WHITE)
                      setPadding(dp(6), dp(5), 0, dp(14))
                  })
                  return col
              }

              private fun buildLibrary(): View {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0x55000000)
                      setPadding(dp(16), dp(12), dp(16), 0)
                  }
                  val search = searchField("Biblioteca de Apps")
                  root.addView(search, LinearLayout.LayoutParams(MATCH, WRAP))

                  val tileW = (resources.displayMetrics.widthPixels - dp(32) - dp(14)) / 2
                  val scroll = ScrollView(this)
                  scroll.isVerticalScrollBarEnabled = false
                  val grid = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, dp(14), 0, dp(12))
                  }
                  scroll.addView(grid, FrameLayout.LayoutParams(MATCH, WRAP))

                  val groups = sorted.groupBy { it.category }
                  val tiles = CATEGORIES.filter { groups.containsKey(it) }
                  for (i in tiles.indices step 2) {
                      val r = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      r.addView(categoryTile(tiles[i], groups[tiles[i]]!!, tileW))
                      if (i + 1 < tiles.size) {
                          r.addView(
                              categoryTile(tiles[i + 1], groups[tiles[i + 1]]!!, tileW),
                              LinearLayout.LayoutParams(tileW, WRAP).apply { leftMargin = dp(14) }
                          )
                      }
                      grid.addView(r)
                  }

                  val shown = mutableListOf<AppItem>()
                  val list = ListView(this)
                  list.divider = null
                  list.setSelector(android.R.color.transparent)
                  list.visibility = View.GONE
                  val adapter = object : BaseAdapter() {
                      override fun getCount() = shown.size
                      override fun getItem(p: Int): Any = shown[p]
                      override fun getItemId(p: Int) = p.toLong()
                      override fun getView(p: Int, convert: View?, parent: ViewGroup): View =
                          appRow(shown[p], Where.LIBRARY)
                  }
                  list.adapter = adapter

                  search.doAfterTextChanged { s ->
                      val q = s?.toString().orEmpty().trim()
                      if (q.isEmpty()) {
                          scroll.visibility = View.VISIBLE
                          list.visibility = View.GONE
                      } else {
                          shown.clear()
                          shown.addAll(sorted.filter { it.label.contains(q, ignoreCase = true) })
                          adapter.notifyDataSetChanged()
                          scroll.visibility = View.GONE
                          list.visibility = View.VISIBLE
                      }
                  }
                  root.addView(scroll, LinearLayout.LayoutParams(MATCH, 0, 1f))
                  root.addView(list, LinearLayout.LayoutParams(MATCH, 0, 1f))
                  return root
              }

              // ================= Overlays =================

              private fun hideKeyboard(v: View) {
                  val imm = getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager
                  imm.hideSoftInputFromWindow(v.windowToken, 0)
              }

              private fun openGroup(title: String, pkgs: List<String>, folder: Entry.Folder?) {
                  if (searchOverlay != null) closeSearch()
                  if (groupOverlay != null) closeGroup()

                  val ov = FrameLayout(this)
                  ov.setBackgroundColor(0xAA000000.toInt())
                  ov.isClickable = true
                  ov.setOnClickListener { closeGroup() }

                  val panelW = (resources.displayMetrics.widthPixels * 0.9f).toInt()
                  val panel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(dp(12), dp(16), dp(12), dp(16))
                      background = rounded(0xCC3A3A3C.toInt(), dp(30))
                      isClickable = true
                  }
                  val titleV: TextView = if (folder != null) EditText(this) else TextView(this)
                  titleV.apply {
                      text = title
                      textSize = 22f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      if (folder != null) {
                          background = null
                          setSingleLine(true)
                          inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_CAP_SENTENCES
                          imeOptions = EditorInfo.IME_ACTION_DONE
                      }
                  }
                  if (folder != null) {
                      (titleV as EditText).doAfterTextChanged { folder.name = it?.toString().orEmpty() }
                  }
                  panel.addView(titleV, LinearLayout.LayoutParams(MATCH, WRAP).apply { bottomMargin = dp(8) })

                  val sv = ScrollView(this)
                  sv.isVerticalScrollBarEnabled = false
                  val g = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  for (chunk in pkgs.chunked(3)) {
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      for (i in 0 until 3) {
                          val a = chunk.getOrNull(i)?.let { apps[it] }
                          val slot = FrameLayout(this)
                          if (a != null) {
                              val cell = LinearLayout(this).apply {
                                  orientation = LinearLayout.VERTICAL
                                  gravity = Gravity.CENTER_HORIZONTAL
                                  setPadding(0, dp(8), 0, dp(4))
                              }
                              val iv = roundIcon(a.icon, iconPx)
                              cell.addView(iv, LinearLayout.LayoutParams(iconPx, iconPx))
                              cell.addView(labelView(a.label), LinearLayout.LayoutParams(MATCH, WRAP))
                              cell.setOnClickListener { launch(a, iv) }
                              cell.setOnLongClickListener {
                                  it.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                                  appMenu(a.pkg, if (folder != null) Where.FOLDER else Where.LIBRARY, folder)
                                  true
                              }
                              slot.addView(cell, FrameLayout.LayoutParams(WRAP, WRAP, Gravity.CENTER_HORIZONTAL))
                          }
                          row.addView(slot, LinearLayout.LayoutParams(0, WRAP, 1f))
                      }
                      g.addView(row)
                  }
                  sv.addView(g, FrameLayout.LayoutParams(MATCH, WRAP))
                  val maxH = (resources.displayMetrics.heightPixels * 0.55f).toInt()
                  panel.addView(sv, LinearLayout.LayoutParams(MATCH, WRAP).apply { })
                  sv.post {
                      if (sv.height > maxH) {
                          val lp = sv.layoutParams
                          lp.height = maxH
                          sv.layoutParams = lp
                      }
                  }

                  ov.addView(panel, FrameLayout.LayoutParams(panelW, WRAP, Gravity.CENTER))
                  content.addView(ov, FrameLayout.LayoutParams(MATCH, MATCH))
                  groupOverlay = ov
                  groupFolder = folder

                  ov.alpha = 0f
                  panel.scaleX = 0.85f
                  panel.scaleY = 0.85f
                  ov.animate().alpha(1f).setDuration(180).start()
                  panel.animate().scaleX(1f).scaleY(1f).setDuration(180).start()
              }

              private fun closeGroup() {
                  val ov = groupOverlay ?: return
                  hideKeyboard(ov)
                  content.removeView(ov)
                  groupOverlay = null
                  groupFolder = null
                  normalize()
                  saveAll()
                  rebuild()
              }

              private fun openSearch() {
                  if (searchOverlay != null) return
                  if (groupOverlay != null) closeGroup()

                  val ov = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xEE000000.toInt())
                      setPadding(dp(16), dp(12), dp(16), 0)
                      isClickable = true
                  }
                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val et = searchField("Pesquisar")
                  val cancel = TextView(this).apply {
                      text = "Cancelar"
                      textSize = 16f
                      setTextColor(0xFF0A84FF.toInt())
                      setPadding(dp(14), dp(8), 0, dp(8))
                      setOnClickListener { closeSearch() }
                  }
                  bar.addView(et, LinearLayout.LayoutParams(0, WRAP, 1f))
                  bar.addView(cancel, LinearLayout.LayoutParams(WRAP, WRAP))
                  ov.addView(bar, LinearLayout.LayoutParams(MATCH, WRAP))

                  val shown = mutableListOf<AppItem>()
                  var webQuery = ""
                  val list = ListView(this)
                  list.divider = null
                  list.setSelector(android.R.color.transparent)
                  val adapter = object : BaseAdapter() {
                      override fun getCount() = shown.size + (if (webQuery.isNotEmpty()) 1 else 0)
                      override fun getItem(p: Int): Any = p
                      override fun getItemId(p: Int) = p.toLong()
                      override fun getView(p: Int, convert: View?, parent: ViewGroup): View {
                          if (p < shown.size) return appRow(shown[p], Where.SEARCH)
                          val t = TextView(this@MainActivity)
                          t.text = "Pesquisar na web por “$webQuery”"
                          t.textSize = 16f
                          t.setTextColor(0xFF0A84FF.toInt())
                          t.setPadding(0, dp(14), 0, dp(14))
                          val q = webQuery
                          t.setOnClickListener {
                              try {
                                  startActivity(
                                      Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q=" + Uri.encode(q)))
                                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  )
                                  closeSearch()
                              } catch (_: Exception) {
                              }
                          }
                          return t
                      }
                  }
                  list.adapter = adapter
                  et.doAfterTextChanged { s ->
                      val q = s?.toString().orEmpty().trim()
                      webQuery = q
                      shown.clear()
                      if (q.isNotEmpty()) {
                          shown.addAll(sorted.filter { it.label.contains(q, ignoreCase = true) }.take(12))
                      }
                      adapter.notifyDataSetChanged()
                  }
                  et.setOnEditorActionListener { _, id, _ ->
                      if (id == EditorInfo.IME_ACTION_SEARCH && shown.isNotEmpty()) {
                          launch(shown[0], null)
                          true
                      } else false
                  }
                  ov.addView(list, LinearLayout.LayoutParams(MATCH, 0, 1f).apply { topMargin = dp(8) })

                  content.addView(ov, FrameLayout.LayoutParams(MATCH, MATCH))
                  searchOverlay = ov
                  ov.alpha = 0f
                  ov.animate().alpha(1f).setDuration(160).start()
                  et.requestFocus()
                  et.postDelayed({
                      val imm = getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager
                      imm.showSoftInput(et, InputMethodManager.SHOW_IMPLICIT)
                  }, 200)
              }

              private fun closeSearch() {
                  val ov = searchOverlay ?: return
                  hideKeyboard(ov)
                  content.removeView(ov)
                  searchOverlay = null
              }

              // ================= Pager =================

              private class VH(v: View) : RecyclerView.ViewHolder(v)

              private inner class PageAdapter : RecyclerView.Adapter<VH>() {
                  override fun getItemCount() = homePages.size + 2
                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                      val f = FrameLayout(parent.context)
                      f.layoutParams = ViewGroup.LayoutParams(MATCH, MATCH)
                      return VH(f)
                  }

                  override fun onBindViewHolder(holder: VH, position: Int) {
                      val f = holder.itemView as FrameLayout
                      f.removeAllViews()
                      val page = when {
                          position == 0 -> buildToday()
                          position == homePages.size + 1 -> buildLibrary()
                          else -> buildHomePage(position - 1)
                      }
                      f.addView(page, FrameLayout.LayoutParams(MATCH, MATCH))
                  }
              }
          }
          EOF_FILE
      - name: Compilar APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - name: Renomear APK
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk iLauncher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: iLauncher-APK
          path: iLauncher.apk

      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: iLauncher v${{ github.run_number }}
          files: iLauncher.apk
