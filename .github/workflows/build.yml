              // ---------- CPU e Temperatura via APIs Oficiais ----------

              private fun readBatteryTemp(): Float? {
                  try {
                      val intent = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                      val temp = intent?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, -1) ?: -1
                      if (temp > 0) return temp / 10f
                  } catch (_: Exception) {}
                  return null
              }

              private fun readCpuTempHpm(): Float? {
                  try {
                      val hpm = getSystemService(Context.HARDWARE_PROPERTIES_SERVICE) as? HardwarePropertiesManager ?: return null
                      val temps = hpm.getDeviceTemperatures(HardwarePropertiesManager.DEVICE_TEMPERATURE_CPU, HardwarePropertiesManager.TEMPERATURE_CURRENT)
                      if (temps != null && temps.isNotEmpty()) {
                          val valid = temps.filter { it in 10f..105f }
                          if (valid.isNotEmpty()) return valid.maxOrNull()
                      }
                  } catch (_: Exception) {}
                  return null
              }

              private fun readCpuTempSysfs(): Float? {
                  try {
                      val dir = File("/sys/class/thermal")
                      val zones = dir.listFiles() ?: return null
                      var maxTemp = -1f
                      for (z in zones) {
                          if (!z.name.startsWith("thermal_zone")) continue
                          try {
                              val typeF = File(z, "type")
                              val tempF = File(z, "temp")
                              if (!typeF.exists() || !tempF.exists()) continue
                              val type = typeF.readText().trim().lowercase()
                              if (!type.contains("cpu") && !type.contains("soc") && !type.contains("tsens")) continue
                              
                              val raw = tempF.readText().trim().toLongOrNull() ?: continue
                              var celsius = if (raw > 1000) raw / 1000f else raw.toFloat()
                              if (celsius > 105f && celsius < 212f) celsius = (celsius - 32f) * 5f / 9f
                              
                              if (celsius in 10f..105f) {
                                  if (celsius > maxTemp) maxTemp = celsius
                              }
                          } catch (_: Exception) {}
                      }
                      if (maxTemp > 0) return maxTemp
                  } catch (_: Exception) {}
                  return null
              }

              private fun readCurrentCpuFreq(): String {
                  try {
                      var maxFreq = 0
                      val cores = Runtime.getRuntime().availableProcessors()
                      for (i in 0 until cores) {
                          val f = File("/sys/devices/system/cpu/cpu$i/cpufreq/scaling_cur_freq")
                          if (f.canRead()) {
                              val khz = f.readText().trim().toLongOrNull() ?: continue
                              if (khz > maxFreq) maxFreq = khz.toInt()
                          }
                      }
                      if (maxFreq > 0) {
                          if (maxFreq >= 1000000) return "%.2f GHz".format(maxFreq / 1000000f)
                          return "${maxFreq / 1000} MHz"
                      }
                  } catch (_: Exception) {}
                  return "—"
              }

              private fun buildCpuCard(): View {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = rounded(0x99000000.toInt(), dp(22))
                      setPadding(dp(16), dp(14), dp(16), dp(14))
                  }
                  card.addView(tv("CPU e Temperatura", 13f, 0xFFBBBBBB.toInt(), true))
                  
                  val freqView = tv("—", 40f, Color.WHITE).apply {
                      typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                  }
                  card.addView(freqView)
                  
                  val tempView = tv("CPU: —", 12f, 0xFFBBBBBB.toInt())
                  card.addView(tempView)
                  
                  val batTempView = tv("Bateria: —", 11f, 0xFFBBBBBB.toInt())
                  card.addView(batTempView, LinearLayout.LayoutParams(MATCH, WRAP).apply { topMargin = dp(2) })

                  card.setOnClickListener {
                      tryStart(Intent(Settings.ACTION_DEVICE_INFO_SETTINGS))
                  }

                  val handler = Handler(Looper.getMainLooper())
                  var running = false
                  val task = object : Runnable {
                      override fun run() {
                          if (!running || !card.isAttachedToWindow) return
                          if (pager.currentItem != 0) {
                              handler.postDelayed(this, 1500)
                              return
                          }
                          try {
                              freqView.text = readCurrentCpuFreq()
                              
                              var cpuTemp = readCpuTempHpm()
                              if (cpuTemp == null) cpuTemp = readCpuTempSysfs()
                              
                              if (cpuTemp != null) {
                                  tempView.text = "CPU: %.1f°C".format(cpuTemp)
                                  tempView.setTextColor(if (cpuTemp > 80f) 0xFFFF3B30.toInt() else 0xFFBBBBBB.toInt())
                              } else {
                                  tempView.text = "CPU: —"
                                  tempView.setTextColor(0xFFBBBBBB.toInt())
                              }
                              
                              val batTemp = readBatteryTemp()
                              if (batTemp != null) {
                                  batTempView.text = "Bateria: %.1f°C".format(batTemp)
                              } else {
                                  batTempView.text = "Bateria: —"
                              }
                              
                          } catch (_: Exception) {
                          }
                          handler.postDelayed(this, 2000L)
                      }
                  }
                  card.addOnAttachStateChangeListener(object : View.OnAttachStateChangeListener {
                      override fun onViewAttachedToWindow(v: View) {
                          running = true
                          handler.post(task)
                      }

                      override fun onViewDetachedFromWindow(v: View) {
                          running = false
                          handler.removeCallbacks(task)
                      }
                  })
                  return card
              }

              private fun buildToday(): View {
                  val w = resources.displayMetrics.widthPixels
                  val gap = dp(12)
                  val side = (w - dp(32) - gap) / 2

                  val sv = ScrollView(this)
                  sv.isVerticalScrollBarEnabled = false
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(8), dp(16), dp(16))
                  }
                  sv.addView(col, FrameLayout.LayoutParams(MATCH, WRAP))

                  val clockView = TextClock(this).apply {
                      format24Hour = "HH:mm"
                      format12Hour = "h:mm"
                      textSize = 56f
                      typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                      setTextColor(Color.WHITE)
                      setShadowLayer(6f, 0f, 1f, 0x66000000)
                      setOnClickListener {
                          tryStart(
                              Intent(AlarmClock.ACTION_SHOW_ALARMS),
                              Intent(Settings.ACTION_DATE_SETTINGS)
                          )
                      }
                  }
                  col.addView(clockView, LinearLayout.LayoutParams(MATCH, WRAP))

                  val dateView = TextClock(this).apply {
                      format24Hour = "EEEE, d 'de' MMMM"
                      format12Hour = "EEEE, d 'de' MMMM"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      setShadowLayer(6f, 0f, 1f, 0x66000000)
                      setOnClickListener {
                          tryStart(
                              Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_APP_CALENDAR),
                              Intent(Settings.ACTION_DATE_SETTINGS)
                          )
                      }
                  }
                  col.addView(dateView, LinearLayout.LayoutParams(MATCH, WRAP))

                  val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }

                  val now = Date()
                  val cal = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = rounded(Color.WHITE, dp(22))
                      setPadding(dp(16), dp(14), dp(16), dp(14))
                  }
                  cal.addView(tv(
                      java.text.SimpleDateFormat("EEEE", Locale.getDefault()).format(now).uppercase(),
                      13f, 0xFFFF3B30.toInt(), true
                  ))
                  cal.addView(tv(
                      java.text.SimpleDateFormat("d", Locale.getDefault()).format(now),
                      58f, 0xFF111111.toInt()
                  ).apply { typeface = Typeface.create("sans-serif-light", Typeface.NORMAL) })
                  cal.addView(tv(
                      java.text.SimpleDateFormat("MMMM yyyy", Locale.getDefault()).format(now),
                      13f, 0xFF6B6B6B.toInt()
                  ))
                  cal.setOnClickListener {
                      tryStart(
                          Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_APP_CALENDAR),
                          Intent(Settings.ACTION_DATE_SETTINGS)
                      )
                  }
                  row.addView(cal, LinearLayout.LayoutParams(side, side))

                  val bi = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val level = bi?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                  val scale = bi?.getIntExtra(BatteryManager.EXTRA_SCALE, 100) ?: 100
                  val pct = if (level >= 0 && scale > 0) level * 100 / scale else 0
                  val st = bi?.getIntExtra(BatteryManager.EXTRA_STATUS, -1) ?: -1
                  val charging = st == BatteryManager.BATTERY_STATUS_CHARGING || st == BatteryManager.BATTERY_STATUS_FULL
                  val bat = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = rounded(0x99000000.toInt(), dp(22))
                      setPadding(dp(16), dp(14), dp(16), dp(14))
                  }
                  bat.addView(tv("Bateria", 13f, 0xFFBBBBBB.toInt(), true))
                  bat.addView(tv("$pct%", 40f, Color.WHITE).apply {
                      typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                  })
                  bat.addView(tv(if (charging) "Carregando" else "Em uso", 13f, 0xFFBBBBBB.toInt()))
                  bat.addView(
                      bar(pct, if (pct < 20 && !charging) 0xFFFF3B30.toInt() else 0xFF34C759.toInt()),
                      LinearLayout.LayoutParams(MATCH, dp(8)).apply { topMargin = dp(12) }
                  )
                  bat.setOnClickListener {
                      tryStart(
                          Intent(Intent.ACTION_POWER_USAGE_SUMMARY),
                          Intent(Settings.ACTION_BATTERY_SAVER_SETTINGS)
                      )
                  }
                  row.addView(bat, LinearLayout.LayoutParams(side, side).apply { leftMargin = gap })
                  col.addView(row, LinearLayout.LayoutParams(MATCH, WRAP).apply { topMargin = dp(16) })

                  var used = 0.0
                  var total = 1.0
                  try {
                      val sf = StatFs(Environment.getDataDirectory().path)
                      total = sf.blockCountLong.toDouble() * sf.blockSizeLong / 1073741824.0
                      val free = sf.availableBlocksLong.toDouble() * sf.blockSizeLong / 1073741824.0
                      used = total - free
                  } catch (_: Exception) {
                  }
                  val sto = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = rounded(0x99000000.toInt(), dp(22))
                      setPadding(dp(16), dp(14), dp(16), dp(14))
                  }
                  sto.addView(tv("Armazenamento", 13f, 0xFFBBBBBB.toInt(), true))
                  sto.addView(tv("%.1f GB de %.0f GB".format(used, total), 22f, Color.WHITE))
                  sto.addView(
                      bar((used / total * 100).toInt(), 0xFF0A84FF.toInt()),
                      LinearLayout.LayoutParams(MATCH, dp(8)).apply { topMargin = dp(12) }
                  )
                  sto.setOnClickListener {
                      tryStart(
                          Intent(Settings.ACTION_INTERNAL_STORAGE_SETTINGS),
                          Intent(Settings.ACTION_MEMORY_CARD_SETTINGS),
                          Intent(Settings.ACTION_DEVICE_INFO_SETTINGS)
                      )
                  }
                  col.addView(sto, LinearLayout.LayoutParams(MATCH, WRAP).apply { topMargin = gap })

                  col.addView(buildCpuCard(), LinearLayout.LayoutParams(MATCH, WRAP).apply { topMargin = gap })

                  return sv
              }

