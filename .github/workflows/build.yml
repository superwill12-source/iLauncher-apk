# iLauncher - cria o projeto Android inteiro e compila o APK sozinho.
# Basta colocar ESTE arquivo em .github/workflows/build.yml no seu repositorio.
name: Build iLauncher APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          cache-disabled: true

      - name: Gerar projeto Android
        run: |
          mkdir -p proj/app/src/main/java/com/ioslauncher proj/app/src/main/res/values
          cat > proj/settings.gradle.kts <<'EOF_FILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ILauncher"
          include(":app")
          EOF_FILE
          cat > proj/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > proj/gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF_FILE
          cat > proj/app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.ioslauncher"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.ioslauncher"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("androidx.viewpager2:viewpager2:1.1.0")
          }
          EOF_FILE
          cat > proj/app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent><action android:name="android.intent.action.DIAL" /></intent>
                  <intent>
                      <action android:name="android.intent.action.SENDTO" />
                      <data android:scheme="smsto" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent><action android:name="android.media.action.IMAGE_CAPTURE" /></intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/LauncherTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="portrait"
                      android:stateNotNeeded="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          cat > proj/app/src/main/res/values/strings.xml <<'EOF_FILE'
          <resources>
              <string name="app_name">iLauncher</string>
          </resources>
          EOF_FILE
          cat > proj/app/src/main/res/values/themes.xml <<'EOF_FILE'
          <resources>
              <style name="LauncherTheme" parent="@android:style/Theme.Material.Wallpaper.NoTitleBar">
                  <item name="android:windowShowWallpaper">true</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:colorAccent">#34C759</item>
                  <item name="android:colorControlActivated">#34C759</item>
              </style>
          </resources>
          EOF_FILE
          cat > proj/app/src/main/java/com/ioslauncher/Store.kt <<'EOF_FILE'
          package com.ioslauncher

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          sealed class Entry {
              data class App(val pkg: String) : Entry()
              class Folder(var name: String, val pkgs: MutableList<String>) : Entry()
          }

          class Store(ctx: Context) {
              private val sp = ctx.getSharedPreferences("layout", Context.MODE_PRIVATE)

              fun loadHome(): MutableList<Entry> {
                  val out = mutableListOf<Entry>()
                  val s = sp.getString("home", null) ?: return out
                  try {
                      val arr = JSONArray(s)
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          if (o.getString("t") == "a") {
                              out.add(Entry.App(o.getString("p")))
                          } else {
                              val l = mutableListOf<String>()
                              val a = o.getJSONArray("a")
                              for (j in 0 until a.length()) l.add(a.getString(j))
                              out.add(Entry.Folder(o.getString("n"), l))
                          }
                      }
                  } catch (_: Exception) {
                  }
                  return out
              }

              fun saveHome(list: List<Entry>) {
                  val arr = JSONArray()
                  for (e in list) {
                      val o = JSONObject()
                      when (e) {
                          is Entry.App -> {
                              o.put("t", "a")
                              o.put("p", e.pkg)
                          }
                          is Entry.Folder -> {
                              o.put("t", "f")
                              o.put("n", e.name)
                              val a = JSONArray()
                              for (p in e.pkgs) a.put(p)
                              o.put("a", a)
                          }
                      }
                      arr.put(o)
                  }
                  sp.edit().putString("home", arr.toString()).apply()
              }

              fun loadDock(): List<String>? {
                  val s = sp.getString("dock", null) ?: return null
                  val l = s.split(",").filter { it.isNotEmpty() }
                  return if (l.isEmpty()) null else l
              }

              fun saveDock(list: List<String>) {
                  sp.edit().putString("dock", list.joinToString(",")).apply()
              }

              fun loadHidden(): Set<String> {
                  return HashSet(sp.getStringSet("hidden", emptySet()) ?: emptySet())
              }

              fun reset() {
                  sp.edit().clear().apply()
              }

              fun saveHidden(set: Set<String>) {
                  sp.edit().putStringSet("hidden", HashSet(set)).apply()
              }
          }
          EOF_FILE
          cat > proj/app/src/main/java/com/ioslauncher/Cfg.kt <<'EOF_FILE'
          package com.ioslauncher

          import android.content.Context
          import android.content.SharedPreferences

          object Cfg {
              private lateinit var sp: SharedPreferences

              val SKINS = listOf(
                  "ios" to "iOS (idêntico ao iPhone)",
                  "ios_dark" to "iOS Escuro",
                  "oneui" to "One UI (Samsung)",
                  "classic" to "Android clássico",
                  "minimal" to "Minimalista"
              )

              private val base: Map<String, Any> = mapOf(
                  "skin" to "ios",
                  "shape" to "squircle",
                  "iconSet" to "ios",
                  "iconSize" to 72,
                  "cols" to 4,
                  "rows" to 0,
                  "labels" to true,
                  "labelSize" to 11,
                  "dock" to true,
                  "dockMax" to 4,
                  "dockAlpha" to 33,
                  "tint" to "light",
                  "dots" to true,
                  "pill" to true,
                  "pillStyle" to "ios",
                  "panelStyle" to "ios",
                  "dockRadius" to 34,
                  "today" to true,
                  "library" to true,
                  "swipeSearch" to true,
                  "drawerGesture" to false,
                  "folderStyle" to "grid3",
                  "wiggle" to true,
                  "folders" to true,
                  "haptics" to true,
                  "animLaunch" to true,
                  "animPress" to true,
                  "animPage" to false,
                  "animStyle" to "ios",
                  "dim" to 0,
                  "gear" to true,
                  "wClock" to true,
                  "wCal" to true,
                  "wBat" to true,
                  "wSto" to true,
                  "wTemp" to true,
                  "wLinks" to true
              )

              fun init(ctx: Context) {
                  sp = ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE)
              }

              fun i(k: String): Int = sp.getInt(k, base[k] as Int)
              fun b(k: String): Boolean = sp.getBoolean(k, base[k] as Boolean)
              fun s(k: String): String = sp.getString(k, base[k] as String) ?: (base[k] as String)

              fun put(k: String, v: Any) {
                  val e = sp.edit()
                  when (v) {
                      is Int -> e.putInt(k, v)
                      is Boolean -> e.putBoolean(k, v)
                      is String -> e.putString(k, v)
                  }
                  e.apply()
              }

              fun applySkin(name: String) {
                  val over: Map<String, Any> = when (name) {
                      "ios_dark" -> mapOf("tint" to "dark", "dockAlpha" to 45, "dim" to 15)
                      "oneui" -> mapOf(
                          "iconSet" to "original", "shape" to "squircle", "iconSize" to 78,
                          "cols" to 5, "rows" to 6, "labelSize" to 12,
                          "dockMax" to 5, "dockAlpha" to 22, "dockRadius" to 28,
                          "pillStyle" to "bar", "panelStyle" to "oneui",
                          "library" to false, "drawerGesture" to true, "animStyle" to "oneui",
                          "folderStyle" to "grid2", "wiggle" to false, "swipeSearch" to false,
                          "animPage" to false, "animPress" to true, "gear" to false
                      )
                      "classic" -> mapOf(
                          "iconSet" to "original", "shape" to "circle", "iconSize" to 64, "cols" to 5,
                          "labelSize" to 12, "tint" to "dark", "dockAlpha" to 55, "today" to false,
                          "pill" to false, "wiggle" to false, "animLaunch" to false, "animPage" to false,
                          "animPress" to false, "drawerGesture" to true
                      )
                      "minimal" -> mapOf(
                          "shape" to "round", "labels" to false, "iconSize" to 70, "pill" to false,
                          "dots" to false, "today" to false, "dockAlpha" to 20
                      )
                      else -> emptyMap()
                  }
                  val e = sp.edit()
                  for ((k, v) in base) {
                      val x: Any = over[k] ?: v
                      when (x) {
                          is Int -> e.putInt(k, x)
                          is Boolean -> e.putBoolean(k, x)
                          is String -> e.putString(k, x)
                      }
                  }
                  e.putString("skin", name)
                  e.apply()
              }
          }
