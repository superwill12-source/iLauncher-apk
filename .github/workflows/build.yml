          cat > proj/app/src/main/java/com/ioslauncher/Gauge.kt <<'EOF_FILE'
          package com.ioslauncher

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.Typeface
          import android.view.View

          class GaugeView(ctx: Context) : View(ctx) {
              var value = 0f
              var minV = 15f
              var maxV = 55f
              var title = ""

              private val track = Paint(Paint.ANTI_ALIAS_FLAG)
              private val arc = Paint(Paint.ANTI_ALIAS_FLAG)
              private val txt = Paint(Paint.ANTI_ALIAS_FLAG)
              private val sub = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rect = RectF()

              init {
                  track.style = Paint.Style.STROKE
                  track.strokeCap = Paint.Cap.ROUND
                  track.color = 0x33FFFFFF
                  arc.style = Paint.Style.STROKE
                  arc.strokeCap = Paint.Cap.ROUND
                  txt.color = Color.WHITE
                  txt.textAlign = Paint.Align.CENTER
                  txt.typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                  sub.color = 0xFFBBBBBB.toInt()
                  sub.textAlign = Paint.Align.CENTER
              }

              override fun onDraw(c: Canvas) {
                  val s = Math.min(width, height).toFloat()
                  val stroke = s * 0.09f
                  val ox = (width - s) / 2f
                  val oy = (height - s) / 2f
                  track.strokeWidth = stroke
                  arc.strokeWidth = stroke
                  rect.set(ox + stroke, oy + stroke, ox + s - stroke, oy + s - stroke)
                  c.drawArc(rect, 150f, 240f, false, track)
                  val f = ((value - minV) / (maxV - minV)).coerceIn(0.02f, 1f)
                  arc.color = when {
                      f < 0.45f -> 0xFF34C759.toInt()
                      f < 0.7f -> 0xFFFF9F0A.toInt()
                      else -> 0xFFFF3B30.toInt()
                  }
                  c.drawArc(rect, 150f, 240f * f, false, arc)
                  txt.textSize = s * 0.28f
                  val cy = oy + s / 2f
                  c.drawText("${value.toInt()}°", width / 2f, cy + txt.textSize * 0.28f, txt)
                  sub.textSize = s * 0.11f
                  c.drawText(title, width / 2f, oy + s - stroke * 0.9f, sub)
              }
          }
          EOF_FILE
          cat > proj/app/src/main/java/com/ioslauncher/Icons.kt <<'EOF_FILE'
          package com.ioslauncher

          import android.graphics.Bitmap
          import android.graphics.BitmapShader
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.ColorFilter
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.Typeface
          import android.graphics.drawable.AdaptiveIconDrawable
          import android.graphics.drawable.Drawable
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale

          object Icons {

              fun build(label: String, pkg: String, base: Drawable): Drawable {
                  val st = Cfg.s("iconSet")
                  val kind = if (st == "original") "default" else kindOf(label, pkg)
                  return IosIcon(kind, base, Cfg.s("shape"), st)
              }

              fun shapePath(size: Float, shape: String): Path {
                  val p = Path()
                  when (shape) {
                      "circle" -> p.addOval(RectF(0f, 0f, size, size), Path.Direction.CW)
                      "round" -> p.addRoundRect(RectF(0f, 0f, size, size), size * 0.2f, size * 0.2f, Path.Direction.CW)
                      "square" -> p.addRect(RectF(0f, 0f, size, size), Path.Direction.CW)
                      else -> return squircle(size)
                  }
                  return p
              }

              fun kindOf(label: String, pkg: String): String {
                  val p = pkg.lowercase()
                  val l = label.lowercase()
                  return when {
                      p.contains("dialer") || p.endsWith(".phone") || l == "telefone" || l == "phone" -> "phone"
                      p.contains("mms") || p.contains("messaging") || l == "mensagens" || l == "messages" || l == "sms" -> "messages"
                      p.contains("camera") || l == "câmera" || l == "camera" -> "camera"
                      p == "com.android.settings" || l == "configurações" || l == "settings" || l == "ajustes" -> "settings"
                      p.contains("clock") || l == "relógio" || l == "clock" -> "clock"
                      p.contains("calculator") || p.contains("calc") -> "calculator"
                      p.contains("chrome") || p.contains("browser") || p.contains("firefox") ||
                          p.contains("brave") || p.contains("opera") || p.contains("msedge") -> "browser"
                      p.contains("gallery") || p.contains("photos") || l == "galeria" || l == "fotos" -> "photos"
                      p.contains("calendar") || l == "agenda" || l == "calendário" -> "calendar"
                      p.contains("notes") || p.contains("keep") || p.contains("notepad") || l == "notas" -> "notes"
                      p.contains(".maps") || l == "maps" || l == "mapas" -> "maps"
                      p.contains("gmail") || p.endsWith(".gm") || p.contains("mail") -> "mail"
                      p.contains("music") || l == "música" -> "music"
                      p.contains("contacts") || l == "contatos" -> "contacts"
                      else -> "default"
                  }
              }

              // Forma "squircle" (superelipse) usada pelo iOS
              fun squircle(size: Float): Path {
                  val path = Path()
                  val n = 5.0
                  val a = size / 2f
                  val steps = 160
                  for (i in 0..steps) {
                      val t = 2.0 * Math.PI * i / steps
                      val ct = Math.cos(t)
                      val st = Math.sin(t)
                      val x = a + a * Math.signum(ct) * Math.pow(Math.abs(ct), 2.0 / n)
                      val y = a + a * Math.signum(st) * Math.pow(Math.abs(st), 2.0 / n)
                      if (i == 0) path.moveTo(x.toFloat(), y.toFloat()) else path.lineTo(x.toFloat(), y.toFloat())
                  }
                  path.close()
                  return path
              }
          }

          class IosIcon(
              private val kind: String,
              private val base: Drawable,
              private val shape: String = "squircle",
              private val iconSet: String = "ios"
          ) : Drawable() {

              private val oneui get() = iconSet == "oneui"


              private val SIZE = 192
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)

              @Volatile
              private var cache: Bitmap? = null

              @Volatile
              private var cacheStamp = -1L

              override fun getIntrinsicWidth() = SIZE
              override fun getIntrinsicHeight() = SIZE

              private fun stamp(): Long =
                  if (kind == "clock" || kind == "calendar") System.currentTimeMillis() / 60000L else 0L

              // Pode ser chamado fora da thread principal para pre-renderizar o icone
              fun prepare() {
                  val r = render()
                  cache = r
                  cacheStamp = stamp()
              }

              override fun draw(canvas: Canvas) {
                  val cached = cache
                  val st = stamp()
                  val b = if (cached != null && st == cacheStamp) {
                      cached
                  } else {
                      val r = render()
                      cache = r
                      cacheStamp = st
                      r
                  }
                  canvas.drawBitmap(b, null, bounds, paint)
              }

              override fun setAlpha(alpha: Int) {
                  paint.alpha = alpha
              }

              override fun setColorFilter(colorFilter: ColorFilter?) {
                  paint.colorFilter = colorFilter
              }

              @Deprecated("Deprecated in Java")
              override fun getOpacity() = PixelFormat.TRANSLUCENT

              // ---------- util ----------

              private fun k(v: Long): Int = v.toInt()

              private fun pt(color: Int, stroke: Float = 0f): Paint {
                  val p = Paint(Paint.ANTI_ALIAS_FLAG)
                  p.color = color
                  if (stroke > 0f) {
                      p.style = Paint.Style.STROKE
                      p.strokeWidth = stroke
                      p.strokeCap = Paint.Cap.ROUND
                  }
                  return p
              }

              private fun gradient(c: Canvas, top: Int, bottom: Int) {
                  val p = Paint()
                  p.shader = LinearGradient(0f, 0f, 0f, 256f, top, bottom, Shader.TileMode.CLAMP)
                  c.drawRect(0f, 0f, 256f, 256f, p)
              }

              private fun render(): Bitmap {
                  val raw = Bitmap.createBitmap(SIZE, SIZE, Bitmap.Config.ARGB_8888)
                  val c = Canvas(raw)
                  c.scale(SIZE / 256f, SIZE / 256f)
                  when (kind) {
                      "phone" -> phone(c)
                      "messages" -> messages(c)
                      "camera" -> camera(c)
                      "settings" -> settings(c)
                      "clock" -> clock(c)
                      "calculator" -> calculator(c)
                      "browser" -> browser(c)
                      "photos" -> photos(c)
                      "calendar" -> calendar(c)
                      "notes" -> notes(c)
                      "maps" -> maps(c)
                      "mail" -> mail(c)
                      "music" -> music(c)
                      "contacts" -> contacts(c)
                      else -> wrap(c)
                  }
                  val out = Bitmap.createBitmap(SIZE, SIZE, Bitmap.Config.ARGB_8888)
                  val oc = Canvas(out)
                  val p = Paint(Paint.ANTI_ALIAS_FLAG)
                  p.shader = BitmapShader(raw, Shader.TileMode.CLAMP, Shader.TileMode.CLAMP)
                  oc.drawPath(Icons.shapePath(SIZE.toFloat(), shape), p)
                  return out
              }

              // ---------- ícone padrão: ícone do app dentro do squircle ----------

              private fun wrap(c: Canvas) {
                  gradient(c, k(0xFFFFFFFF), k(0xFFE9E9EE))
                  val b = base
                  val fit = iconSet == "ios"
                  if (b is AdaptiveIconDrawable) {
                      b.background?.let {
                          it.setBounds(-64, -64, 320, 320)
                          it.draw(c)
                      }
                      val fg = b.foreground
                      if (fg != null) {
                          if (fit) {
                              drawFitted(c, fg, true)
                          } else {
                              fg.setBounds(-64, -64, 320, 320)
                              fg.draw(c)
                          }
                      }
                  } else {
                      if (fit) {
                          drawFitted(c, b, false)
                      } else {
                          b.setBounds(14, 14, 242, 242)
                          b.draw(c)
                      }
                  }
              }

              // Mede o desenho e o amplia para preencher o ícone (evita ícones pequenos)
              private fun drawFitted(c: Canvas, d: Drawable, adaptive: Boolean) {
                  val m = 200
                  val extra = (m * 0.25f).toInt()
                  val lo = if (adaptive) -extra else 0
                  val hi = if (adaptive) m + extra else m
                  val tmp = Bitmap.createBitmap(m, m, Bitmap.Config.ARGB_8888)
                  val tc = Canvas(tmp)
                  d.setBounds(lo, lo, hi, hi)
                  d.draw(tc)
                  val px = IntArray(m * m)
                  tmp.getPixels(px, 0, m, 0, 0, m, m)
                  tmp.recycle()
                  var minX = m
                  var minY = m
                  var maxX = -1
                  var maxY = -1
                  for (y in 0 until m) {
                      val row = y * m
                      for (x in 0 until m) {
                          if ((px[row + x] ushr 24) > 40) {
                              if (x < minX) minX = x
                              if (x > maxX) maxX = x
                              if (y < minY) minY = y
                              if (y > maxY) maxY = y
                          }
                      }
                  }
                  val lo256 = if (adaptive) -64 else 0
                  val hi256 = if (adaptive) 320 else 256
                  val w = maxX - minX + 1
                  val h = maxY - minY + 1
                  if (maxX < 0 || (w >= m * 0.94f && h >= m * 0.94f)) {
                      d.setBounds(lo256, lo256, hi256, hi256)
                      d.draw(c)
                      return
                  }
                  val k = 256f / m
                  val cx = (minX + maxX + 1) / 2f * k
                  val cy = (minY + maxY + 1) / 2f * k
                  val s = (0.84f * 256f / (Math.max(w, h) * k)).coerceIn(0.5f, 2.6f)
                  c.save()
                  c.translate(128f, 128f)
                  c.scale(s, s)
                  c.translate(-cx, -cy)
                  d.setBounds(lo256, lo256, hi256, hi256)
                  d.draw(c)
                  c.restore()
              }

              // ---------- ícones estilo iOS ----------

              private fun phone(c: Canvas) {
                  if (oneui) gradient(c, k(0xFF4ADE80), k(0xFF16A34A)) else gradient(c, k(0xFF6CEB7F), k(0xFF1DBA43))
                  val w = pt(Color.WHITE, 34f)
                  c.drawArc(RectF(70f, 26f, 230f, 186f), 85f, 100f, false, w)
                  val f = pt(Color.WHITE)
                  c.drawCircle(157f, 186f, 26f, f)
                  c.drawCircle(70f, 99f, 26f, f)
              }

              private fun messages(c: Canvas) {
                  if (oneui) gradient(c, k(0xFF5AA2FF), k(0xFF2563EB)) else gradient(c, k(0xFF6CEB7F), k(0xFF1DBA43))
                  val w = pt(Color.WHITE)
                  c.drawOval(RectF(40f, 50f, 216f, 180f), w)
                  val t = Path()
                  t.moveTo(78f, 160f)
                  t.lineTo(54f, 214f)
                  t.lineTo(122f, 176f)
                  t.close()
                  c.drawPath(t, w)
              }

              private fun camera(c: Canvas) {
