              private fun buildHomePage(hp: Int): View {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(8), dp(8), dp(8), 0)
                  }
                  val items = homePages.getOrNull(hp) ?: emptyList()
                  for (r in 0 until rows) {
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      root.addView(row, LinearLayout.LayoutParams(MATCH, 0, 1f))
                      for (c in 0 until COLS) {
                          val slot = FrameLayout(this)
                          val e = items.getOrNull(r * COLS + c)
                          if (e != null) {
                              slot.addView(
                                  entryCell(e),
                                  FrameLayout.LayoutParams(
                                      resources.displayMetrics.widthPixels / COLS - dp(6),
                                      WRAP,
                                      Gravity.TOP or Gravity.CENTER_HORIZONTAL
                                  )
                              )
                          }
                          if (editing) slot.setOnDragListener(slotListener(e, hp))
                          row.addView(slot, LinearLayout.LayoutParams(0, MATCH, 1f))
                      }
                  }
                  return root
              }

              // ================= DOCK (IPHONE STYLE) =================
              private fun buildDock() {
                  dock.removeAllViews()
                  if (dockPkgs.isEmpty()) {
                      dock.visibility = View.GONE
                      return
                  }
                  dock.visibility = View.VISIBLE

                  val dockIconSize = iconPx // Tamanho EXATO igual ao da tela inicial

                  for (pk in dockPkgs) {
                      val a = apps[pk] ?: continue
                      
                      // Container com espaçamento uniforme
                      val frame = FrameLayout(this)
                      frame.layoutParams = LinearLayout.LayoutParams(0, WRAP, 1f)

                      // ImageView configurada para preencher o quadrado perfeitamente
                      val iv = ImageView(this).apply {
                          setImageDrawable(a.icon)
                          scaleType = ImageView.ScaleType.FIT_XY
                      }

                      pressable(iv)
                      
                      iv.setOnClickListener {
                          resetTouchState(iv)
                          launch(a, iv, iv)
                      }
                      iv.setOnLongClickListener {
                          it.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                          resetTouchState(iv)
                          appMenu(a.pkg, Where.DOCK)
                          true
                      }

                      // Centraliza a imagem no frame, garantindo que não encolha
                      frame.addView(iv, FrameLayout.LayoutParams(dockIconSize, dockIconSize, Gravity.CENTER))
                      dock.addView(frame)
                  }
              }
